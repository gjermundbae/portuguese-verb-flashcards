<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portuguese Sentence Flashcards</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F5F0E8;
    --surface: #FFFDF7;
    --surface2: #EDE8DC;
    --border: #D4CCBA;
    --border2: #BEB5A0;
    --text: #1A1712;
    --text2: #6B6456;
    --text3: #9E9485;
    --green: #2D6A4F;
    --green-bg: #D8F3DC;
    --red: #7D2B2B;
    --red-bg: #FFE8E8;
    --accent: #C4922A;
    --accent-bg: #FFF3DC;
    --radius: 12px;
    --radius-sm: 8px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 4rem;
  }

  header { text-align: center; margin-bottom: 2.5rem; }

  header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 2.4rem;
    color: var(--text);
    letter-spacing: -0.5px;
    line-height: 1.1;
  }

  header h1 em { font-style: italic; color: var(--accent); }

  header p {
    font-size: 0.75rem;
    color: var(--text3);
    margin-top: 0.4rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  header p a {
    color: var(--text3);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.15s, color 0.15s;
    padding-bottom: 1px;
  }

  header p a:hover { color: var(--text2); border-bottom-color: var(--border2); }
  header p a.active { color: var(--text2); border-bottom-color: var(--text3); }

  .container { width: 100%; max-width: 560px; }

  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1.5rem; }

  .fc-tag {
    font-size: 0.7rem;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text2);
    cursor: pointer;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    transition: all 0.15s;
    font-family: 'DM Mono', monospace;
  }

  .fc-tag:hover { border-color: var(--border2); }

  .fc-tag.active {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 1.25rem;
  }

  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.75rem;
    text-align: center;
  }

  .stat-num {
    font-family: 'DM Serif Display', serif;
    font-size: 1.75rem;
    color: var(--text);
    line-height: 1;
  }

  .stat-num.green { color: var(--green); }
  .stat-num.red { color: var(--red); }

  .stat-lbl {
    font-size: 0.65rem;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 3px;
  }

  .progress-row { display: flex; align-items: center; gap: 10px; margin-bottom: 1.75rem; }

  .progress-bg {
    flex: 1;
    height: 4px;
    background: var(--surface2);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--green);
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  .progress-pct {
    font-size: 0.7rem;
    color: var(--text3);
    min-width: 32px;
    text-align: right;
    letter-spacing: 0.05em;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2rem 1.75rem;
    margin-bottom: 1rem;
    animation: slideIn 0.2s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-meta {
    font-size: 0.65rem;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 0.6rem;
  }

  .card-english {
    font-family: 'DM Serif Display', serif;
    font-size: 1.5rem;
    color: var(--text);
    line-height: 1.3;
    margin-bottom: 0.35rem;
  }

  .card-portuguese {
    font-size: 1.05rem;
    color: var(--text2);
    line-height: 1.5;
    margin-bottom: 1.5rem;
    letter-spacing: 0.01em;
    min-height: 1.5em;
  }

  .card-portuguese.revealed { color: var(--green); }
  .card-portuguese.revealed-wrong { color: var(--red); }

  .card-portuguese .slot-variant {
    border-bottom: 1px dashed var(--border2);
    padding-bottom: 1px;
  }

  .card-sub {
    font-size: 0.72rem;
    color: var(--text3);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 1.5rem;
  }

  .input-row { display: flex; gap: 8px; }

  .answer-input {
    flex: 1;
    font-family: 'DM Mono', monospace;
    font-size: 1rem;
    padding: 0.65rem 0.9rem;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s, background 0.15s;
  }

  .answer-input:focus { border-color: var(--accent); background: var(--surface); }

  .answer-input.correct {
    border-color: var(--green);
    background: var(--green-bg);
    color: var(--green);
  }

  .answer-input.wrong {
    border-color: var(--red);
    background: var(--red-bg);
    color: var(--red);
  }

  .answer-input:disabled { opacity: 1; }

  .check-btn {
    font-size: 1.15rem;
    padding: 0.65rem 0.9rem;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border2);
    background: var(--text);
    color: var(--bg);
    cursor: pointer;
    transition: opacity 0.15s, background 0.2s, border-color 0.2s;
    white-space: nowrap;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .check-btn:hover { opacity: 0.85; }
  .check-btn.go-green { background: var(--green); border-color: var(--green); }
  .check-btn.go-red { background: var(--red); border-color: var(--red); }

  .feedback {
    margin-top: 1rem;
    font-size: 0.8rem;
    min-height: 18px;
    line-height: 1.5;
  }

  .feedback.ok { color: var(--green); }
  .feedback.err { color: var(--red); }

  .tip {
    font-size: 0.78rem;
    color: var(--text2);
    margin-top: 0.5rem;
    padding-top: 0.75rem;
    border-top: 1px dashed var(--border);
    line-height: 1.55;
  }

  .tip strong { color: var(--text); font-weight: 500; }

  .variant-tag {
    display: inline-block;
    font-size: 0.7rem;
    background: var(--accent-bg);
    color: var(--accent);
    border: 1px solid #E8C97A;
    border-radius: 999px;
    padding: 2px 10px;
    letter-spacing: 0.04em;
    margin-left: 6px;
    margin-top: 4px;
    vertical-align: middle;
  }

  .controls {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .ctrl-btn {
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    color: var(--text3);
    background: none;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.4rem 0.8rem;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: all 0.15s;
    text-transform: uppercase;
  }

  .ctrl-btn:hover { background: var(--surface); color: var(--text2); border-color: var(--border2); }

  .done-screen { text-align: center; padding: 3rem 1rem; }

  .done-screen h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.8rem;
    color: var(--text);
    margin-bottom: 0.5rem;
  }

  .done-screen p {
    font-size: 0.8rem;
    color: var(--text2);
    margin-bottom: 2rem;
    letter-spacing: 0.04em;
  }

  .result-stats {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    margin: 1.25rem 0 1.5rem;
  }

  .result-stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.9rem 0.75rem;
  }

  .result-stat-num {
    font-family: 'DM Serif Display', serif;
    font-size: 1.55rem;
    line-height: 1;
    color: var(--text);
  }

  .result-stat-num.green { color: var(--green); }
  .result-stat-num.red { color: var(--red); }

  .result-stat-lbl {
    font-size: 0.65rem;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 0.35rem;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  .answer-input.shake { animation: shake 0.4s ease; }
</style>
</head>
<body>

<header>
  <h1>Frases em <em>Português</em></h1>
  <p><a href="index.html">verbs</a> · <a href="passado.html">passado</a> · <a href="numbers_dates.html">numbers &amp; dates</a> · <a href="connecting.html">connecting words</a> · <a href="glossary.html">glossary</a> · <a href="nouns.html">nouns</a> · <a href="adjectives.html">adjectives</a> · <a href="adverbs.html">adverbs</a> · <a class="active" href="sentences.html">sentences</a></p>
</header>

<div class="container">
  <div id="practiceChrome">
    <div class="filters" id="filterRow"></div>

    <div class="stats" id="statsRow">
      <div class="stat"><div class="stat-num" id="statTotal">0</div><div class="stat-lbl">Total</div></div>
      <div class="stat"><div class="stat-num green" id="statKnown">0</div><div class="stat-lbl">Known</div></div>
      <div class="stat"><div class="stat-num red" id="statLeft">0</div><div class="stat-lbl">Left</div></div>
    </div>

    <div class="progress-row">
      <div class="progress-bg"><div class="progress-fill" id="progressBar" style="width:0%"></div></div>
      <span class="progress-pct" id="progressPct">0%</span>
    </div>
  </div>

  <div id="cardArea"></div>
</div>

<script src="drill-common.js"></script>
<script>
// Sentence cards. Conventions:
//   - Always use explicit subject pronouns (eu, voce, nos, ele, ela, eles, elas).
//   - Canonical form = neutral spoken BR (no a gente / ta / to in v1).
//   - {slotId} placeholders in pt are resolved against `slots`; first variant per
//     slot is the displayed canonical. All cartesian combinations are accepted.
const ALL_CARDS = [
  // Present basics
  { en: "I drink water.", pt: "Eu bebo água.", group: "Present basics",
    note: "Beber (to drink) is a regular -er verb: eu bebo, você bebe, nós bebemos, eles bebem." },
  { en: "You speak Portuguese.", pt: "Você fala português.", group: "Present basics",
    note: "Você is the default 2nd person in BR Portuguese and conjugates like ele/ela: você fala." },
  { en: "We live in São Paulo.", pt: "Nós moramos em São Paulo.", group: "Present basics",
    note: "Morar em = to live in. With a city that takes an article you'd contract: em + o Rio = no Rio." },
  { en: "She works a lot.", pt: "Ela trabalha muito.", group: "Present basics",
    note: "Trabalhar is a regular -ar verb: eu trabalho, ela trabalha, nós trabalhamos. Muito here is an adverb modifying the verb." },
  { en: "They (m.) eat bread.", pt: "Eles comem pão.", group: "Present basics",
    note: "Eles = masculine or mixed plural; elas = all feminine. Generic 'bread' takes no article here." },
  { en: "I have two brothers.", pt: "Eu tenho dois irmãos.", group: "Present basics",
    note: "Ter is irregular: eu tenho, você tem, nós temos, eles têm. Irmãos covers brothers or mixed-gender siblings." },
  { en: "I want a coffee.", pt: "Eu quero um café.", group: "Present basics",
    note: "Querer is irregular: eu quero, você quer, nós queremos, eles querem." },
  { en: "You understand everything.", pt: "Você entende tudo.", group: "Present basics",
    note: "Entender is a regular -er verb. Tudo = everything (pronoun); todo = every (adjective)." },
  { en: "We need to sleep.", pt: "Nós precisamos dormir.", group: "Present basics",
    note: "With an infinitive, BR Portuguese drops the 'de': 'precisamos dormir', not 'precisamos de dormir'. With a noun the 'de' returns: 'precisamos de água'." },
  { en: "He sees the sea.", pt: "Ele vê o mar.", group: "Present basics",
    note: "Ver is irregular: eu vejo, você vê, nós vemos, eles veem. Don't confuse with vir (to come): eu venho, ele vem." },
  { en: "She opens the window.", pt: "Ela abre a janela.", group: "Present basics",
    note: "Abrir is a regular -ir verb: eu abro, você abre, nós abrimos, eles abrem." },
  { en: "I read every day.", pt: "Eu leio todo dia.", group: "Present basics",
    note: "Ler is irregular: eu leio, você lê, nós lemos, eles leem. 'Todo dia' (every day) is more idiomatic than 'cada dia'." },
  { en: "I don't speak English.", pt: "Eu não falo inglês.", group: "Present basics",
    note: "Negation is simply 'não' before the verb — no auxiliary needed. Languages take no article: falo inglês, falo português." },
  { en: "I think Norway can win the World Cup.", batch: 3, pt: "Eu acho que a Noruega pode ganhar a Copa do Mundo.", group: "Present basics",
    note: "'Que' after 'acho' is mandatory — Portuguese never drops the connector the way English drops 'that' ('I think Norway can win'). Template: 'Acho que [alguém] pode [verbo].' = 'I think [someone] can [verb].'" },

  // Ser vs Estar
  { en: "I am Brazilian.", pt: "Eu sou {gender_br}.",
    slots: { gender_br: ["brasileiro", "brasileira"] },
    group: "Ser vs Estar",
    note: "Nationality is an essential trait → ser. The adjective agrees with the speaker's gender: brasileiro (m.) / brasileira (f.)." },
  { en: "She is tired.", pt: "Ela está cansada.", group: "Ser vs Estar",
    note: "Being tired is a temporary state → estar. Cansada agrees with the feminine subject; for a man: cansado." },
  { en: "The coffee is hot.", pt: "O café está quente.", group: "Ser vs Estar",
    note: "Temperature is a current state → estar. Quente is invariable for gender (ends in -e)." },
  { en: "We are students.", pt: "Nós somos estudantes.", group: "Ser vs Estar",
    note: "Profession/identity → ser. Estudante is invariable for gender; only the plural -s changes." },
  { en: "He is at home.", pt: "Ele está em casa.", group: "Ser vs Estar",
    note: "Location → estar. The idiom 'em casa' (at home) takes no article; with someone's house: 'na casa de João'." },
  { en: "He is a doctor.", pt: "Ele é médico.", group: "Ser vs Estar",
    note: "Profession → ser. BR Portuguese drops the indefinite article: 'Ele é médico', not 'Ele é um médico' (the latter would emphasize 'a doctor [as opposed to a nurse]')." },
  { en: "She is pretty.", pt: "Ela é bonita.", group: "Ser vs Estar",
    note: "Inherent quality → ser. With estar ('Ela está bonita') it would mean 'she looks pretty right now' — both are grammatical but mean different things." },
  { en: "We (m.) are nervous.", pt: "Nós estamos {nervosos}.",
    slots: { nervosos: ["nervosos", "nervosas"] },
    group: "Ser vs Estar",
    note: "Temporary emotion → estar. The adjective agrees with the group: nervosos (mixed or all-masculine) / nervosas (all-feminine)." },
  { en: "The party is at my house.", pt: "A festa é na minha casa.", group: "Ser vs Estar",
    note: "Big gotcha: the LOCATION of an event uses ser, not estar. 'A festa é aqui' = the party takes place here. Compare 'O livro está aqui' (object's current location → estar)." },
  { en: "I am hungry.", pt: "Eu estou com fome.", group: "Ser vs Estar",
    note: "Portuguese expresses physical states with 'estar com + noun', literally 'to be with hunger': com fome, com sede, com frio, com calor, com sono, com medo." },

  // Past (pretérito perfeito)
  { en: "I ate bread yesterday.", pt: "Eu comi pão ontem.", group: "Past",
    note: "Pretérito perfeito of comer: eu comi, você comeu, nós comemos, eles comeram. Used for completed past actions." },
  { en: "She went to the market.", pt: "Ela foi {dest_mercado}.",
    slots: { dest_mercado: ["ao mercado", "pro mercado"] },
    group: "Past",
    note: "Foi is the past of both ir and ser — context tells you which. Two natural options: 'ao mercado' (a + o = ao, more written/formal) and 'pro mercado' (para + o = pro, very common spoken BR). Both are correct in Rio." },
  { en: "We watched a movie yesterday.", pt: "Nós {assistimos_filme} ontem.",
    slots: { assistimos_filme: ["assistimos um filme", "assistimos a um filme"] },
    group: "Past",
    note: "Formal grammar requires 'assistir a' (with preposition). Spoken BR very commonly drops the 'a'. Both accepted." },
  { en: "You drank coffee this morning.", pt: "Você bebeu café hoje de manhã.", group: "Past",
    note: "Pretérito perfeito of beber: você bebeu. 'Hoje de manhã' literally 'today in the morning' = this morning." },
  { en: "They (m.) arrived late.", pt: "Eles chegaram tarde.", group: "Past",
    note: "Pretérito perfeito of chegar: eles chegaram. Here tarde is the adverb 'late', not the noun 'afternoon'." },
  { en: "I bought a book.", pt: "Eu comprei um livro.", group: "Past",
    note: "Comprar (to buy) is regular: eu comprei, você comprou, nós compramos, eles compraram." },
  { en: "She lived in Rio.", pt: "Ela morou no Rio.", group: "Past",
    note: "Morar past: eu morei, ela morou, nós moramos. 'Rio' takes the article 'o' → em + o = no Rio. Same for o Brasil, os EUA." },
  { en: "She wrote a letter.", pt: "Ela escreveu uma carta.", group: "Past",
    note: "Escrever past: eu escrevi, ela escreveu, nós escrevemos, eles escreveram. Regular -er pattern in the preterite." },
  { en: "I had a dog.", pt: "Eu tive um cachorro.", group: "Past",
    note: "Ter past is irregular: eu tive, você teve, nós tivemos, eles tiveram. For an ongoing past state you'd use the imperfect: 'eu tinha um cachorro' = 'I used to have a dog'." },
  { en: "You opened the door.", pt: "Você abriu a porta.", group: "Past",
    note: "Abrir past: eu abri, você abriu, nós abrimos, eles abriram. Regular -ir pattern." },
  { en: "We did the homework.", pt: "Nós fizemos a lição de casa.", group: "Past",
    note: "Fazer past is irregular: eu fiz, você fez, nós fizemos, eles fizeram. 'Lição de casa' is the BR term for homework (Portugal: 'trabalhos de casa')." },
  { en: "I had to work yesterday.", pt: "Eu tive que trabalhar ontem.", group: "Past", batch: 1,
    note: "'Ter que + infinitive' = had to (obligation). Don't confuse with possession ('Eu tive um cachorro' = I had a dog) — the 'que + verb' pattern shifts the meaning to necessity. Spoken BR also accepts 'ter de', but 'ter que' dominates." },
  { en: "There was a party at João's house yesterday.", pt: "Teve uma festa na casa do João ontem.", group: "Past", batch: 1,
    note: "Impersonal 'ter' = 'there is/was' in spoken BR. No subject and no agreement — it stays singular even with a plural noun ('teve muitas festas ontem', not 'tiveram')." },
  { en: "He got nervous before the test.", pt: "Ele ficou nervoso antes da prova.", group: "Past", batch: 1,
    note: "Ficar = to become (a change of state). 'Ficou nervoso' = he became nervous. Contrast: 'estava nervoso' = was nervous (ongoing state at that time); 'é nervoso' would describe him as a nervous person by nature." },
  { en: "The cake turned out delicious.", pt: "O bolo ficou delicioso.", group: "Past", batch: 1,
    note: "Ficar also means 'to turn out / end up' — the result of a process. Compare with 'foi delicioso' (it was delicious — the overall experience) and 'teve um sabor delicioso' (it had a delicious flavor — a property it possessed). 'Ficou' zooms in on the final state something arrived at." },
  { en: "I called you 5 minutes ago.", pt: "Eu liguei faz 5 minutos.", group: "Past", batch: 2,
    note: "Ligar = to call (by phone). Past: eu liguei, você ligou, nós ligamos, eles ligaram. Spoken BR uses 'faz X tempo' for time elapsed — not 'há X tempo' (PT-PT/formal). Same pattern: 'faz uma hora', 'faz 3 dias', 'faz um mês'." },

  // Prepositions & contractions
  { en: "I go to the school.", pt: "Eu vou {para_a} escola.",
    slots: { para_a: ["para a", "pra"] },
    group: "Prepositions",
    note: "Para a (to the, fem.) routinely contracts to 'pra' in spoken BR. Both are accepted; 'pra' is informal but extremely common." },
  { en: "She is at the office.", pt: "Ela está no escritório.", group: "Prepositions",
    note: "em + o = no. Always contract — never write 'em o'. Location with estar." },
  { en: "We came from the beach.", pt: "Nós viemos da praia.", group: "Prepositions",
    note: "de + a = da. Viemos is past of vir (to come): eu vim, você veio, nós viemos, eles vieram." },
  { en: "The book is on the table.", pt: "O livro está na mesa.", group: "Prepositions",
    note: "em + a = na. 'Na mesa' covers both 'on the table' and 'at the table' depending on context." },
  { en: "I think about you.", pt: "Eu penso em você.", group: "Prepositions",
    note: "Pensar em = to think about. The preposition matters: pensar de means 'to have an opinion of'." },
  { en: "I spoke with João.", pt: "Eu falei com o João.", group: "Prepositions",
    note: "BR Portuguese commonly uses definite articles before personal names: 'o João', 'a Maria'. Falar com = to speak with." },
  { en: "I come from Brazil.", pt: "Eu venho do Brasil.", group: "Prepositions",
    note: "de + o = do. Countries that take an article: o Brasil, os Estados Unidos, a França, a Alemanha. Portugal is an exception — no article." },
  { en: "She lives in the United States.", pt: "Ela mora nos Estados Unidos.", group: "Prepositions",
    note: "em + os = nos. Plural-article countries always contract: nos Estados Unidos, dos Estados Unidos." },
  { en: "We arrived at the airport.", pt: "Nós chegamos {no_aeroporto}.",
    slots: { no_aeroporto: ["no aeroporto", "ao aeroporto"] },
    group: "Prepositions",
    note: "Prescriptive grammar wants 'chegar a' (ao aeroporto). Spoken BR overwhelmingly says 'chegar em' (no aeroporto). Both accepted; 'no' is the natural choice." },
  { en: "The gift is for you.", pt: "O presente é para você.", group: "Prepositions",
    note: "Para = recipient or purpose ('for you', 'in order to'). Por = cause or exchange ('because of', 'in exchange for'). They are not interchangeable." },
  { en: "I traveled by car.", pt: "Eu viajei de carro.", group: "Prepositions",
    note: "Means of transport uses 'de': de carro, de ônibus, de avião, de bicicleta. The one exception is 'a pé' (on foot)." },
  { en: "The movie starts in 2 hours.", pt: "O filme começa daqui a 2 horas.", group: "Prepositions", batch: 2,
    note: "'Daqui a + time' = 'in X time from now': daqui a 2 horas, daqui a 3 dias. You may also hear 'em 2 horas', but 'daqui a' anchors the countdown explicitly to the present moment." },

  // Questions
  { en: "How are you?", pt: "Como você está?", group: "Questions",
    note: "Word order: question word + subject + verb. No auxiliary like English 'do' is needed; intonation (or '?') marks the question." },
  { en: "Where do you live?", pt: "Onde você mora?", group: "Questions",
    note: "Onde = where (static location). Aonde = to where (direction): 'Aonde você vai?' for 'Where are you going?'" },
  { en: "What do you want?", pt: "O que você quer?", group: "Questions",
    note: "'O que' = what (asking about a thing). 'Que' alone also works in writing, but 'o que' is the spoken norm in BR." },
  { en: "Why did she leave?", pt: "Por que ela saiu?", group: "Questions",
    note: "'Por que' (two words) asks 'why?'. 'Porque' (one word) answers 'because'. Sair past: eu saí, ela saiu, nós saímos, eles saíram." },
  { en: "How much does the coffee cost?", pt: "Quanto custa o café?", group: "Questions",
    note: "Quanto agrees with what it quantifies: quanto (m.sg), quanta (f.sg), quantos (m.pl), quantas (f.pl). The subject can follow the verb in questions: 'custa o café'." },

  // Time expressions
  { en: "I will stay in Brazil from February to March.",
    pt: "Eu vou ficar no Brasil de fevereiro {a_ate} março.",
    slots: { a_ate: ["a", "até"] },
    group: "Time expressions",
    batch: 3,
    note: "'De X a Y' = from X to Y for date ranges. Both 'a' and 'até' are natural: 'de fevereiro a março' (cleaner/written) vs 'de fevereiro até março' (more emphatic, very common spoken). Months take no article, so no contraction needed." },
  { en: "I work from 9 to 5.",
    pt: "Eu trabalho das 9 às 17.",
    group: "Time expressions",
    batch: 3,
    note: "Clock-time ranges use mandatory contractions: 'das' (de + as) and 'às' (a + as). Horas is always feminine plural — so always das/às, never dos/aos. Brazil commonly uses 24-hour time in writing: 17 = 5pm." },
  { en: "Last week I worked a lot.",
    pt: "Semana passada eu trabalhei muito.",
    group: "Time expressions",
    batch: 3,
    note: "'Semana passada' = last week, placed before the subject with no preposition. Same pattern: 'mês passado', 'ano passado', 'fim de semana passado'." },
  { en: "This weekend I'm going to the beach.",
    pt: "Esse fim de semana eu vou {dest_praia}.",
    slots: { dest_praia: ["pra praia", "para a praia"] },
    group: "Time expressions",
    batch: 3,
    note: "'Esse fim de semana' = this weekend. 'Esse' is the everyday spoken-BR demonstrative for things close in time. 'Fim de semana' is masculine: o fim de semana." },
  { en: "How long are you staying in Brazil?",
    pt: "Quanto tempo você vai ficar no Brasil?",
    group: "Time expressions",
    batch: 3,
    note: "'Quanto tempo' = how long (lit. how much time). The natural answer uses 'de X a Y', 'até Y', or 'por X semanas'." },
  { en: "I've been here for two months.",
    pt: "Faz dois meses que eu estou aqui.",
    group: "Time expressions",
    batch: 3,
    note: "'Faz X tempo que + verb' = I've been doing this for X — the action is still ongoing. Compare: 'faz dois meses' alone = 'two months ago' (a completed, finished action)." },
  { en: "I'm staying until the end of August.",
    pt: "Eu vou ficar até o fim de agosto.",
    group: "Time expressions",
    batch: 3,
    note: "'Até' = until / through. 'Fim de + month' = end of [month]. The article goes with 'fim' (o fim), not with the month name (de agosto, no article)." }
];

const GROUPS = ["Present basics", "Ser vs Estar", "Past", "Prepositions", "Questions", "Time expressions"];
const LATEST_BATCH = Math.max(0, ...ALL_CARDS.map(c => c.batch ?? 0));

const MAX_CARTESIAN = 32;

let activeGroups = new Set(GROUPS);
let showOnlyLatestBatch = false;
let deck = [];
let current = 0;
let known = new Set();
let answered = false;
let perfect = true;
let stats = { errors: 0, firstTry: 0 };

function normalize(str) {
  return str.trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[?!.,;:]+/g, "")
    .replace(/\s+/g, " ");
}

function escapeHtml(str) {
  return str
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function shuffle(arr) {
  return [...arr].sort(() => Math.random() - 0.5);
}

// ---- Slot template engine ---------------------------------------------------

const SLOT_RE = /\{([A-Za-z0-9_]+)\}/g;

function getSlotIds(card) {
  const ids = [];
  let match;
  SLOT_RE.lastIndex = 0;
  while ((match = SLOT_RE.exec(card.pt)) !== null) ids.push(match[1]);
  return ids;
}

function substitute(template, mapping) {
  return template.replace(SLOT_RE, (_, id) => mapping[id]);
}

// Canonical = first variant of each slot.
function getCanonical(card) {
  const mapping = {};
  for (const id of getSlotIds(card)) {
    const variants = card.slots && card.slots[id];
    mapping[id] = variants && variants.length ? variants[0] : `{${id}}`;
  }
  return substitute(card.pt, mapping);
}

// All accepted full sentences (cartesian product of slot variants).
function expandCandidates(card) {
  const ids = getSlotIds(card);
  if (ids.length === 0) return [card.pt];

  let size = 1;
  for (const id of ids) {
    const variants = (card.slots && card.slots[id]) || [];
    if (variants.length === 0) {
      throw new Error(`Card "${card.en}" references slot "${id}" with no variants.`);
    }
    size *= variants.length;
    if (size > MAX_CARTESIAN) {
      throw new Error(`Card "${card.en}" expands to >${MAX_CARTESIAN} variants; tighten the slots.`);
    }
  }

  let mappings = [{}];
  for (const id of ids) {
    const variants = card.slots[id];
    const next = [];
    for (const m of mappings) {
      for (const v of variants) next.push({ ...m, [id]: v });
    }
    mappings = next;
  }
  return mappings.map(m => substitute(card.pt, m));
}

function getAcceptedSet(card) {
  return new Set(expandCandidates(card).map(normalize));
}

function isCorrect(card, input) {
  return getAcceptedSet(card).has(normalize(input));
}

// Validate every card at load — fail loudly on authoring mistakes.
for (const card of ALL_CARDS) expandCandidates(card);

// ---- Deck management --------------------------------------------------------

function getFilteredCards() {
  return ALL_CARDS.filter(card =>
    activeGroups.has(card.group) && (!showOnlyLatestBatch || card.batch === LATEST_BATCH)
  );
}

function buildDeck() {
  deck = shuffle(getFilteredCards());
  current = 0;
  known = new Set();
  answered = false;
  perfect = true;
  stats = { errors: 0, firstTry: 0 };
  render();
}

function toggleGroup(group) {
  if (activeGroups.has(group)) {
    if (activeGroups.size === 1) return;
    activeGroups.delete(group);
  } else {
    activeGroups.add(group);
  }
  renderFilters();
  buildDeck();
}

function renderFilters() {
  const row = document.getElementById("filterRow");
  const groupTags = GROUPS.map(group => {
    const safeGroup = group.replace(/\\/g, "\\\\").replace(/'/g, "\\'");
    return `<button class="fc-tag ${activeGroups.has(group) ? "active" : ""}" onclick="toggleGroup('${safeGroup}')">${escapeHtml(group)}</button>`;
  }).join("");
  const latestTag = `<button class="fc-tag ${showOnlyLatestBatch ? "active" : ""}" onclick="toggleLatestBatch()">Only new sentences</button>`;
  row.innerHTML = groupTags + latestTag;
}

function toggleLatestBatch() {
  showOnlyLatestBatch = !showOnlyLatestBatch;
  renderFilters();
  buildDeck();
}

function updateStats() {
  const total = deck.length;
  const knownCount = known.size;
  const pct = total > 0 ? Math.round((knownCount / total) * 100) : 0;

  document.getElementById("statTotal").textContent = total;
  document.getElementById("statKnown").textContent = knownCount;
  document.getElementById("statLeft").textContent = total - knownCount;
  document.getElementById("progressBar").style.width = pct + "%";
  document.getElementById("progressPct").textContent = pct + "%";
}

function buildReveal(card) {
  const ids = getSlotIds(card);
  const variantNotes = ids
    .filter(id => card.slots[id].length > 1)
    .map(id => {
      const variants = card.slots[id].map(escapeHtml).join(" / ");
      return `<span class="variant-tag">also: ${variants}</span>`;
    })
    .join("");

  const tip = card.note ? `<div class="tip">${escapeHtml(card.note)}</div>` : "";
  const variants = variantNotes ? `<div>${variantNotes}</div>` : "";
  return variants + tip;
}

function render() {
  updateStats();
  const area = document.getElementById("cardArea");
  const remaining = deck.filter((_, i) => !known.has(i));

  if (deck.length === 0) {
    const subtitle = showOnlyLatestBatch
      ? "No cards match the current groups in the latest batch."
      : "Pick at least one sentence group to keep practicing.";
    area.innerHTML = `
      <div class="card done-screen">
        <h2>No matching cards</h2>
        <p>${subtitle}</p>
      </div>
    `;
    return;
  }

  if (remaining.length === 0) {
    const title = perfect ? "Perfeito!" : "Deck complete!";
    const subtitle = perfect
      ? `You cleared all ${deck.length} sentence cards without errors.`
      : `You finished all ${deck.length} sentence cards.`;

    area.innerHTML = `
      <div class="card done-screen">
        <h2>${title}</h2>
        <p>${subtitle}</p>
        <div class="result-stats">
          <div class="result-stat">
            <div class="result-stat-num green">${stats.firstTry}</div>
            <div class="result-stat-lbl">First try</div>
          </div>
          <div class="result-stat">
            <div class="result-stat-num red">${stats.errors}</div>
            <div class="result-stat-lbl">Errors made</div>
          </div>
        </div>
        <button class="ctrl-btn" onclick="buildDeck()" style="font-size:0.8rem;padding:0.6rem 1.4rem;">Start over ↺</button>
      </div>
    `;
    return;
  }

  while (known.has(current)) current = (current + 1) % deck.length;
  const card = deck[current];

  area.innerHTML = `
    <div class="card">
      <div class="card-meta">${escapeHtml(card.group)}</div>
      <div class="card-english">${escapeHtml(card.en)}</div>
      <div class="card-portuguese" id="ptLine"></div>
      <div class="card-sub">Translate to Portuguese · use explicit subject (eu, você, nós…)</div>
      <div class="input-row">
        <input class="answer-input" id="answerInput" type="text" placeholder="type the full sentence..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
        <button class="check-btn" id="actionBtn" onclick="handleAction()">→</button>
      </div>
      <div class="feedback" id="feedback"></div>
      <div id="revealArea"></div>
    </div>
    <div class="controls">
      <button class="ctrl-btn" onclick="skipCard()">Skip →</button>
      <button class="ctrl-btn" onclick="buildDeck()">Restart ↺</button>
    </div>
  `;

  answered = false;
  const input = document.getElementById("answerInput");
  focusAnswerInput(input);
  input.addEventListener("keydown", event => {
    if (event.key === "Enter") handleAction();
  });
}

function handleAction() {
  if (answered) {
    nextCard();
    return;
  }
  checkAnswer();
}

function checkAnswer() {
  const card = deck[current];
  const input = document.getElementById("answerInput");
  const feedback = document.getElementById("feedback");
  const revealArea = document.getElementById("revealArea");
  const button = document.getElementById("actionBtn");
  const ptLine = document.getElementById("ptLine");

  if (!input.value.trim()) return;

  answered = true;
  input.disabled = true;

  const canonical = getCanonical(card);
  const correct = isCorrect(card, input.value);

  ptLine.textContent = canonical;
  ptLine.className = `card-portuguese ${correct ? "revealed" : "revealed-wrong"}`;

  if (correct) {
    stats.firstTry++;
    input.classList.add("correct");
    button.classList.add("go-green");
    feedback.className = "feedback ok";
    feedback.innerHTML = `✓ Correct`;
    known.add(current);
    updateStats();
  } else {
    stats.errors++;
    perfect = false;
    input.classList.add("wrong", "shake");
    button.classList.add("go-red");
    feedback.className = "feedback err";
    feedback.innerHTML = `✗ Canonical answer above`;
    setTimeout(() => input.classList.remove("shake"), 400);
  }

  revealArea.innerHTML = buildReveal(card);
  setTimeout(() => button.focus(), 0);
}

function advanceToNextUnknown() {
  if (deck.length === 0 || known.size === deck.length) {
    answered = false;
    render();
    return;
  }

  current = (current + 1) % deck.length;
  while (known.has(current)) current = (current + 1) % deck.length;
  answered = false;
  render();
}

function nextCard() {
  advanceToNextUnknown();
}

function skipCard() {
  known.add(current);
  updateStats();
  advanceToNextUnknown();
}

renderFilters();
buildDeck();
</script>
</body>
</html>

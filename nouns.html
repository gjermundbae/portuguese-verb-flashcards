<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portuguese Noun Flashcards</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F5F0E8;
    --surface: #FFFDF7;
    --surface2: #EDE8DC;
    --border: #D4CCBA;
    --border2: #BEB5A0;
    --text: #1A1712;
    --text2: #6B6456;
    --text3: #9E9485;
    --green: #2D6A4F;
    --green-bg: #D8F3DC;
    --red: #7D2B2B;
    --red-bg: #FFE8E8;
    --accent: #C4922A;
    --accent-bg: #FFF3DC;
    --radius: 12px;
    --radius-sm: 8px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 4rem;
  }

  header { text-align: center; margin-bottom: 2.5rem; }

  header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 2.4rem;
    color: var(--text);
    letter-spacing: -0.5px;
    line-height: 1.1;
  }

  header h1 em { font-style: italic; color: var(--accent); }

  header p {
    font-size: 0.75rem;
    color: var(--text3);
    margin-top: 0.4rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  header p a {
    color: var(--text3);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.15s, color 0.15s;
    padding-bottom: 1px;
  }

  header p a:hover { color: var(--text2); border-bottom-color: var(--border2); }
  header p a.active { color: var(--text2); border-bottom-color: var(--text3); }

  .container { width: 100%; max-width: 520px; }

  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1.5rem; }

  .fc-tag {
    font-size: 0.7rem;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text2);
    cursor: pointer;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    transition: all 0.15s;
    font-family: 'DM Mono', monospace;
  }

  .fc-tag:hover { border-color: var(--border2); }

  .fc-tag.active {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 1.25rem;
  }

  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.75rem;
    text-align: center;
  }

  .stat-num {
    font-family: 'DM Serif Display', serif;
    font-size: 1.75rem;
    color: var(--text);
    line-height: 1;
  }

  .stat-num.green { color: var(--green); }
  .stat-num.red { color: var(--red); }

  .stat-lbl {
    font-size: 0.65rem;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 3px;
  }

  .progress-row { display: flex; align-items: center; gap: 10px; margin-bottom: 1.75rem; }

  .progress-bg {
    flex: 1;
    height: 4px;
    background: var(--surface2);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--green);
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  .progress-pct {
    font-size: 0.7rem;
    color: var(--text3);
    min-width: 32px;
    text-align: right;
    letter-spacing: 0.05em;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2rem 1.75rem;
    margin-bottom: 1rem;
    animation: slideIn 0.2s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-meta {
    font-size: 0.65rem;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 0.6rem;
  }

  .card-english {
    font-family: 'DM Serif Display', serif;
    font-size: 1.5rem;
    color: var(--text);
    line-height: 1.3;
    margin-bottom: 0.35rem;
  }

  .card-portuguese {
    font-size: 1.05rem;
    color: var(--text2);
    line-height: 1.5;
    margin-bottom: 1.5rem;
    letter-spacing: 0.01em;
  }

  .card-sub {
    font-size: 0.72rem;
    color: var(--text3);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 1.5rem;
  }

  .blank-slot {
    display: inline-block;
    min-width: 4.5em;
    border-bottom: 2px dashed var(--accent);
    text-align: center;
    color: var(--accent);
    font-weight: 500;
    margin: 0 2px;
    vertical-align: baseline;
  }

  .blank-slot.revealed {
    border-bottom-style: solid;
    border-bottom-color: var(--green);
    color: var(--green);
  }

  .blank-slot.revealed-wrong {
    border-bottom-style: solid;
    border-bottom-color: var(--red);
    color: var(--red);
  }

  .input-row { display: flex; gap: 8px; }

  .answer-input {
    flex: 1;
    font-family: 'DM Mono', monospace;
    font-size: 1rem;
    padding: 0.65rem 0.9rem;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s, background 0.15s;
  }

  .answer-input:focus { border-color: var(--accent); background: var(--surface); }

  .answer-input.correct {
    border-color: var(--green);
    background: var(--green-bg);
    color: var(--green);
  }

  .answer-input.wrong {
    border-color: var(--red);
    background: var(--red-bg);
    color: var(--red);
  }

  .answer-input:disabled { opacity: 1; }

  .check-btn {
    font-size: 1.15rem;
    padding: 0.65rem 0.9rem;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border2);
    background: var(--text);
    color: var(--bg);
    cursor: pointer;
    transition: opacity 0.15s, background 0.2s, border-color 0.2s;
    white-space: nowrap;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .check-btn:hover { opacity: 0.85; }
  .check-btn.go-green { background: var(--green); border-color: var(--green); }
  .check-btn.go-red { background: var(--red); border-color: var(--red); }

  .feedback {
    margin-top: 1rem;
    font-size: 0.8rem;
    min-height: 18px;
    line-height: 1.5;
  }

  .feedback.ok { color: var(--green); }
  .feedback.err { color: var(--red); }

  .tip {
    font-size: 0.78rem;
    color: var(--text2);
    margin-top: 0.5rem;
    padding-top: 0.75rem;
    border-top: 1px dashed var(--border);
    line-height: 1.55;
  }

  .tip strong { color: var(--text); font-weight: 500; }

  .pron-tag {
    display: inline-block;
    font-size: 0.7rem;
    background: var(--accent-bg);
    color: var(--accent);
    border: 1px solid #E8C97A;
    border-radius: 999px;
    padding: 2px 10px;
    letter-spacing: 0.04em;
    margin-left: 8px;
    vertical-align: middle;
  }

  .controls {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .ctrl-btn {
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    color: var(--text3);
    background: none;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.4rem 0.8rem;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: all 0.15s;
    text-transform: uppercase;
  }

  .ctrl-btn:hover { background: var(--surface); color: var(--text2); border-color: var(--border2); }

  .done-screen { text-align: center; padding: 3rem 1rem; }

  .done-screen h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.8rem;
    color: var(--text);
    margin-bottom: 0.5rem;
  }

  .done-screen p {
    font-size: 0.8rem;
    color: var(--text2);
    margin-bottom: 2rem;
    letter-spacing: 0.04em;
  }

  .result-stats {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    margin: 1.25rem 0 1.5rem;
  }

  .result-stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.9rem 0.75rem;
  }

  .result-stat-num {
    font-family: 'DM Serif Display', serif;
    font-size: 1.55rem;
    line-height: 1;
    color: var(--text);
  }

  .result-stat-num.green { color: var(--green); }
  .result-stat-num.red { color: var(--red); }

  .result-stat-lbl {
    font-size: 0.65rem;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 0.35rem;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  .answer-input.shake { animation: shake 0.4s ease; }
</style>
</head>

<div class="container">
  <div id="practiceChrome">
    <div class="filters" id="filterRow"></div>

    <div class="stats" id="statsRow">
      <div class="stat"><div class="stat-num" id="statTotal">0</div><div class="stat-lbl">Total</div></div>
      <div class="stat"><div class="stat-num green" id="statKnown">0</div><div class="stat-lbl">Known</div></div>
      <div class="stat"><div class="stat-num red" id="statLeft">0</div><div class="stat-lbl">Left</div></div>
    </div>

    <div class="progress-row">
      <div class="progress-bg"><div class="progress-fill" id="progressBar" style="width:0%"></div></div>
      <span class="progress-pct" id="progressPct">0%</span>
    </div>
  </div>

  <div id="cardArea"></div>
</div>

<script src="drill-common.js"></script>
<script>
const ALL_CARDS = [

  { en: "the woman", pt: "a mulher", article: "a", noun: "mulher", gender: "feminine", pronIpa: "[a mu'ʎɛʁ]", pronHint: "ah moo-LYEHR", example: "A mulher trabalha no centro.", exampleEn: "The woman works downtown.", group: "people" },
  { en: "the child", pt: "a criança", article: "a", noun: "criança", gender: "feminine", pronIpa: "[a kɾi'ɐ̃sɐ]", pronHint: "ah kree-AHN-sah", example: "A criança está brincando.", exampleEn: "The child is playing.", group: "people", note: "Criança is grammatically feminine no matter the child's gender." },

  { en: "the house", pt: "a casa", article: "a", noun: "casa", gender: "feminine", pronIpa: "[a 'kazɐ]", pronHint: "ah KAH-zah", example: "A casa fica perto daqui.", exampleEn: "The house is near here.", group: "home & food" },
  { en: "the water", pt: "a água", article: "a", noun: "água", gender: "feminine", pronIpa: "[a 'agwɐ]", pronHint: "ah AH-gwah", example: "A água está bem gelada.", exampleEn: "The water is very cold.", group: "home & food" },
  { en: "the coffee", pt: "o café", article: "o", noun: "café", gender: "masculine", pronIpa: "[u ka'fɛ]", pronHint: "oo kah-FEH", example: "O café está na mesa.", exampleEn: "The coffee is on the table.", group: "home & food" },
  { en: "the bread", pt: "o pão", article: "o", noun: "pão", gender: "masculine", pronIpa: "[u 'pɐ̃w]", pronHint: "oo POWng", example: "O pão está quentinho.", exampleEn: "The bread is still warm.", group: "home & food" },
  { en: "the rice", pt: "o arroz", article: "o", noun: "arroz", gender: "masculine", pronIpa: "[u a'ʁos]", pronHint: "oo ah-HOHSS", example: "O arroz ficou ótimo.", exampleEn: "The rice turned out great.", group: "home & food" },

  { en: "the book", pt: "o livro", article: "o", noun: "livro", gender: "masculine", pronIpa: "[u 'livɾu]", pronHint: "oo LEE-vroo", example: "O livro está na mochila.", exampleEn: "The book is in the backpack.", group: "home & food" },
  { en: "the table", pt: "a mesa", article: "a", noun: "mesa", gender: "feminine", pronIpa: "[a 'mezɐ]", pronHint: "ah MEH-zah", example: "A mesa é de madeira.", exampleEn: "The table is made of wood.", group: "home & food" },
  { en: "the door", pt: "a porta", article: "a", noun: "porta", gender: "feminine", pronIpa: "[a 'pɔʁtɐ]", pronHint: "ah POHR-tah", example: "A porta está aberta.", exampleEn: "The door is open.", group: "home & food" },
  { en: "the window", pt: "a janela", article: "a", noun: "janela", gender: "feminine", pronIpa: "[a ʒa'nɛlɐ]", pronHint: "ah zhah-NEH-lah", example: "A janela dá para a rua.", exampleEn: "The window faces the street.", group: "home & food" },
  { en: "the key", pt: "a chave", article: "a", noun: "chave", gender: "feminine", pronIpa: "[a 'ʃavi]", pronHint: "ah SHAH-vee", example: "A chave está na bolsa.", exampleEn: "The key is in the bag.", group: "home & food" },
  { en: "the bed", pt: "a cama", article: "a", noun: "cama", gender: "feminine", pronIpa: "[a 'kɐ̃mɐ]", pronHint: "ah KAHN-mah", example: "A cama é muito confortável.", exampleEn: "The bed is very comfortable.", group: "home & food" },
  { en: "the room / bedroom", pt: "o quarto", article: "o", noun: "quarto", gender: "masculine", pronIpa: "[u 'kwaʁtu]", pronHint: "oo KWAHR-too", example: "O quarto fica no segundo andar.", exampleEn: "The bedroom is on the second floor.", group: "home & food", note: "Quarto can mean room in general or bedroom depending on context." },
  { en: "the bathroom", pt: "o banheiro", article: "o", noun: "banheiro", gender: "masculine", pronIpa: "[u bɐ'ɲejɾu]", pronHint: "oo bah-NYEH-roo", example: "O banheiro fica à esquerda.", exampleEn: "The bathroom is on the left.", group: "home & food" },

  { en: "the city", pt: "a cidade", article: "a", noun: "cidade", gender: "feminine", pronIpa: "[a si'dadʒi]", pronHint: "ah see-DAH-jee", example: "A cidade é bem tranquila.", exampleEn: "The city is quite calm.", group: "city & travel" },

  { en: "the airplane", pt: "o avião", article: "o", noun: "avião", gender: "masculine", pronIpa: "[u avi'ɐ̃w]", pronHint: "oo ah-vee-OWng", example: "O avião sai às sete.", exampleEn: "The airplane leaves at seven.", group: "city & travel" },

  { en: "the work / the job", pt: "o trabalho", article: "o", noun: "trabalho", gender: "masculine", pronIpa: "[u tɾa'baʎu]", pronHint: "oo trah-BAH-lyoo", example: "O trabalho começa às oito.", exampleEn: "Work starts at eight.", group: "work & study" },
  { en: "the class / lesson", pt: "a aula", article: "a", noun: "aula", gender: "feminine", pronIpa: "[a 'awlɐ]", pronHint: "ah OW-lah", example: "A aula começa em cinco minutos.", exampleEn: "The class starts in five minutes.", group: "work & study" },
  { en: "the question", pt: "a pergunta", article: "a", noun: "pergunta", gender: "feminine", pronIpa: "[a peʁ'gũtɐ]", pronHint: "ah pehr-GOON-tah", example: "A pergunta é muito boa.", exampleEn: "The question is very good.", group: "work & study" },
  { en: "the answer", pt: "a resposta", article: "a", noun: "resposta", gender: "feminine", pronIpa: "[a ʁes'pɔstɐ]", pronHint: "ah hess-POHS-tah", example: "A resposta está certa.", exampleEn: "The answer is correct.", group: "work & study" },
  { en: "the problem", pt: "o problema", article: "o", noun: "problema", gender: "masculine", pronIpa: "[u pɾo'blemɐ]", pronHint: "oo proh-BLEH-mah", example: "O problema é pequeno.", exampleEn: "The problem is small.", group: "work & study", note: "Words ending in -ma are often masculine in Portuguese." },
  { en: "the number", pt: "o número", article: "o", noun: "número", gender: "masculine", pronIpa: "[u 'numeɾu]", pronHint: "oo NOO-meh-roo", example: "O número está errado.", exampleEn: "The number is wrong.", group: "work & study" },

  { en: "the teacher", pt: "o professor", alts: ["a professora"], article: "o", noun: "professor", gender: "masculine", pronIpa: "[u pɾofe'soʁ]", pronHint: "oo proh-feh-SOHR", example: "O professor fala devagar.", exampleEn: "The teacher speaks slowly.", group: "work & study" },

  { en: "the jacket / coat", pt: "o casaco", article: "o", noun: "casaco", gender: "masculine", pronIpa: "[u ka'zaku]", pronHint: "oo kah-ZAH-koo", example: "O casaco está no cabide.", exampleEn: "The jacket is on the hanger.", group: "clothing", batch: 1 }
];

const GROUPS = ["people", "home & food", "city & travel", "work & study", "time & nature", "animals", "insects", "clothing"];
const LATEST_BATCH = Math.max(0, ...ALL_CARDS.map(c => c.batch ?? 0));
let activeGroups = new Set(GROUPS);
let showOnlyLatestBatch = false;
let deck = [];
let current = 0;
let known = new Set();
let answered = false;
let perfect = true;
let stats = { errors: 0, firstTry: 0 };

function normalize(str) {
  return str.trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[?!.,;:]+/g, "")
    .replace(/\s+/g, " ");
}

function getAcceptedAnswers(card) {
  return [card.pt, ...(card.alts || [])];
}

function getUniqueAcceptedAnswers(card) {
  const seen = new Set();
  return getAcceptedAnswers(card).filter(answer => {
    const normalized = normalize(answer);
    if (seen.has(normalized)) return false;
    seen.add(normalized);
    return true;
  });
}

function formatAcceptedAnswers(card) {
  return getSentenceSpec(card).acceptedAnswers.map(escapeHtml).join(" / ");
}

function shuffle(arr) {
  return [...arr].sort(() => Math.random() - 0.5);
}

function escapeHtml(str) {
  return str
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function includesIgnoreCase(text, target) {
  return text.toLowerCase().includes(target.toLowerCase());
}

function getSentenceSpec(card) {
  const acceptedAnswers = getUniqueAcceptedAnswers(card);

  for (const answer of acceptedAnswers) {
    if (answer && includesIgnoreCase(card.example, answer)) {
      return {
        blank: answer,
        acceptedAnswers
      };
    }
  }

  if (includesIgnoreCase(card.example, card.noun)) {
    return {
      blank: card.noun,
      acceptedAnswers: [card.noun]
    };
  }

  return {
    blank: card.pt,
    acceptedAnswers: [card.pt]
  };
}

function getFilteredCards() {
  return ALL_CARDS.filter(card =>
    activeGroups.has(card.group) &&
    (!showOnlyLatestBatch || card.batch === LATEST_BATCH)
  );
}

function buildDeck() {
  deck = shuffle(getFilteredCards());
  current = 0;
  known = new Set();
  answered = false;
  perfect = true;
  stats = { errors: 0, firstTry: 0 };
  render();
}

function toggleGroup(group) {
  if (activeGroups.has(group)) {
    if (activeGroups.size === 1) return;
    activeGroups.delete(group);
  } else {
    activeGroups.add(group);
  }
  renderFilters();
  buildDeck();
}

function renderFilters() {
  const row = document.getElementById("filterRow");
  const groupTags = GROUPS.map(group => {
    const safeGroup = group.replace(/\\/g, "\\\\").replace(/'/g, "\\'");
    return `<button class="fc-tag ${activeGroups.has(group) ? "active" : ""}" onclick="toggleGroup('${safeGroup}')">${escapeHtml(group)}</button>`;
  }).join("");
  const latestTag = `<button class="fc-tag ${showOnlyLatestBatch ? "active" : ""}" onclick="toggleLatestBatch()">Only new nouns</button>`;
  row.innerHTML = groupTags + latestTag;
}

function toggleLatestBatch() {
  showOnlyLatestBatch = !showOnlyLatestBatch;
  renderFilters();
  buildDeck();
}

function updateStats() {
  const total = deck.length;
  const knownCount = known.size;
  const pct = total > 0 ? Math.round((knownCount / total) * 100) : 0;

  document.getElementById("statTotal").textContent = total;
  document.getElementById("statKnown").textContent = knownCount;
  document.getElementById("statLeft").textContent = total - knownCount;
  document.getElementById("progressBar").style.width = pct + "%";
  document.getElementById("progressPct").textContent = pct + "%";
}

function buildReveal(card) {
  if (!card.note) return "";

  return `
    <div class="tip">${escapeHtml(card.note)}</div>
  `;
}

function renderSentence(card, reveal) {
  const spec = getSentenceSpec(card);
  const regex = new RegExp(spec.blank.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i");
  const match = regex.exec(card.example);

  if (!match) return escapeHtml(card.example);

  const before = card.example.slice(0, match.index);
  const after = card.example.slice(match.index + match[0].length);
  const className = reveal === "correct"
    ? "blank-slot revealed"
    : reveal === "wrong"
      ? "blank-slot revealed-wrong"
      : "blank-slot";
  const contents = reveal ? escapeHtml(match[0]) : "&nbsp;";

  return `${escapeHtml(before)}<span class="${className}">${contents}</span>${escapeHtml(after)}`;
}

function render() {
  updateStats();
  const area = document.getElementById("cardArea");
  const remaining = deck.filter((_, i) => !known.has(i));

  if (deck.length === 0) {
    area.innerHTML = `
      <div class="card done-screen">
        <h2>No matching cards</h2>
        <p>Pick at least one noun group to keep practicing.</p>
      </div>
    `;
    return;
  }

  if (remaining.length === 0) {
    const title = perfect ? "Perfeito!" : "Deck complete!";
    const subtitle = perfect
      ? `You cleared all ${deck.length} noun cards without errors.`
      : `You finished all ${deck.length} noun cards.`;

    area.innerHTML = `
      <div class="card done-screen">
        <h2>${title}</h2>
        <p>${subtitle}</p>
        <div class="result-stats">
          <div class="result-stat">
            <div class="result-stat-num green">${stats.firstTry}</div>
            <div class="result-stat-lbl">First try</div>
          </div>
          <div class="result-stat">
            <div class="result-stat-num red">${stats.errors}</div>
            <div class="result-stat-lbl">Errors made</div>
          </div>
        </div>
        <button class="ctrl-btn" onclick="buildDeck()" style="font-size:0.8rem;padding:0.6rem 1.4rem;">Start over ↺</button>
      </div>
    `;
    return;
  }

  while (known.has(current)) current = (current + 1) % deck.length;
  const card = deck[current];

  area.innerHTML = `
    <div class="card">
      <div class="card-meta">${escapeHtml(card.group)}</div>
      <div class="card-english">${escapeHtml(card.exampleEn)}</div>
      <div class="card-portuguese">${renderSentence(card, null)}</div>
      <div class="card-sub">Type the missing Portuguese noun</div>
      <div class="input-row">
        <input class="answer-input" id="answerInput" type="text" placeholder="type here..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
        <button class="check-btn" id="actionBtn" onclick="handleAction()">→</button>
      </div>
      <div class="feedback" id="feedback"></div>
      <div id="revealArea"></div>
    </div>
    <div class="controls">
      <button class="ctrl-btn" onclick="skipCard()">Skip →</button>
      <button class="ctrl-btn" onclick="buildDeck()">Restart ↺</button>
    </div>
  `;

  answered = false;
  const input = document.getElementById("answerInput");
  focusAnswerInput(input);
  input.addEventListener("keydown", event => {
    if (event.key === "Enter") handleAction();
  });
}

function handleAction() {
  if (answered) {
    nextCard();
    return;
  }
  checkAnswer();
}

function checkAnswer() {
  const card = deck[current];
  const input = document.getElementById("answerInput");
  const feedback = document.getElementById("feedback");
  const revealArea = document.getElementById("revealArea");
  const button = document.getElementById("actionBtn");
  const ptLine = document.querySelector(".card-portuguese");

  if (!input.value.trim()) return;

  answered = true;
  input.disabled = true;

  const given = normalize(input.value);
  const sentenceSpec = getSentenceSpec(card);
  const acceptedAnswers = sentenceSpec.acceptedAnswers;
  const acceptedNorms = new Set(acceptedAnswers.map(normalize));
  const answerDisplay = formatAcceptedAnswers(card);

  if (acceptedNorms.has(given)) {
    stats.firstTry++;
    input.classList.add("correct");
    button.classList.add("go-green");
    feedback.className = "feedback ok";
    feedback.innerHTML = acceptedAnswers.length > 1
      ? `✓ Correct — accepted here: <strong>${answerDisplay}</strong> <span class="pron-tag">${escapeHtml(card.pronHint)}</span>`
      : `✓ Correct — <strong>${answerDisplay}</strong> <span class="pron-tag">${escapeHtml(card.pronHint)}</span>`;
    ptLine.innerHTML = renderSentence(card, "correct");
    revealArea.innerHTML = buildReveal(card);
    known.add(current);
    updateStats();
  } else {
    stats.errors++;
    perfect = false;
    input.classList.add("wrong", "shake");
    button.classList.add("go-red");
    feedback.className = "feedback err";
    feedback.innerHTML = acceptedAnswers.length > 1
      ? `✗ Accepted here: <strong>${answerDisplay}</strong> <span class="pron-tag">${escapeHtml(card.pronHint)}</span>`
      : `✗ The answer is <strong>${answerDisplay}</strong> <span class="pron-tag">${escapeHtml(card.pronHint)}</span>`;
    ptLine.innerHTML = renderSentence(card, "wrong");
    revealArea.innerHTML = buildReveal(card);
    setTimeout(() => input.classList.remove("shake"), 400);
  }

  setTimeout(() => button.focus(), 0);
}

function advanceToNextUnknown() {
  if (deck.length === 0 || known.size === deck.length) {
    answered = false;
    render();
    return;
  }

  current = (current + 1) % deck.length;
  while (known.has(current)) current = (current + 1) % deck.length;
  answered = false;
  render();
}

function nextCard() {
  advanceToNextUnknown();
}

function skipCard() {
  known.add(current);
  updateStats();
  advanceToNextUnknown();
}

renderFilters();
buildDeck();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portuguese Adverb Flashcards</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F5F0E8;
    --surface: #FFFDF7;
    --surface2: #EDE8DC;
    --border: #D4CCBA;
    --border2: #BEB5A0;
    --text: #1A1712;
    --text2: #6B6456;
    --text3: #9E9485;
    --green: #2D6A4F;
    --green-bg: #D8F3DC;
    --red: #7D2B2B;
    --red-bg: #FFE8E8;
    --accent: #C4922A;
    --accent-bg: #FFF3DC;
    --radius: 12px;
    --radius-sm: 8px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 4rem;
  }

  header { text-align: center; margin-bottom: 2.5rem; }

  header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 2.4rem;
    color: var(--text);
    letter-spacing: -0.5px;
    line-height: 1.1;
  }

  header h1 em { font-style: italic; color: var(--accent); }

  header p {
    font-size: 0.75rem;
    color: var(--text3);
    margin-top: 0.4rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  header p a {
    color: var(--text3);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.15s, color 0.15s;
    padding-bottom: 1px;
  }

  header p a:hover { color: var(--text2); border-bottom-color: var(--border2); }
  header p a.active { color: var(--text2); border-bottom-color: var(--text3); }

  .container { width: 100%; max-width: 520px; }

  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1.5rem; }

  .fc-tag {
    font-size: 0.7rem;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text2);
    cursor: pointer;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    transition: all 0.15s;
    font-family: 'DM Mono', monospace;
  }

  .fc-tag:hover { border-color: var(--border2); }

  .fc-tag.active {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 1.25rem;
  }

  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.75rem;
    text-align: center;
  }

  .stat-num {
    font-family: 'DM Serif Display', serif;
    font-size: 1.75rem;
    color: var(--text);
    line-height: 1;
  }

  .stat-num.green { color: var(--green); }
  .stat-num.red { color: var(--red); }

  .stat-lbl {
    font-size: 0.65rem;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 3px;
  }

  .progress-row { display: flex; align-items: center; gap: 10px; margin-bottom: 1.75rem; }

  .progress-bg {
    flex: 1;
    height: 4px;
    background: var(--surface2);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--green);
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  .progress-pct {
    font-size: 0.7rem;
    color: var(--text3);
    min-width: 32px;
    text-align: right;
    letter-spacing: 0.05em;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2rem 1.75rem;
    margin-bottom: 1rem;
    animation: slideIn 0.2s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-meta {
    font-size: 0.65rem;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 0.6rem;
  }

  .card-prompt {
    font-family: 'DM Serif Display', serif;
    font-size: 1.9rem;
    color: var(--text);
    line-height: 1.2;
    margin-bottom: 0.35rem;
  }

  .card-sub {
    font-size: 0.72rem;
    color: var(--text3);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 1.5rem;
  }

  .input-row { display: flex; gap: 8px; }

  .answer-input {
    flex: 1;
    font-family: 'DM Mono', monospace;
    font-size: 1rem;
    padding: 0.65rem 0.9rem;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s, background 0.15s;
  }

  .answer-input:focus { border-color: var(--accent); background: var(--surface); }

  .answer-input.correct {
    border-color: var(--green);
    background: var(--green-bg);
    color: var(--green);
  }

  .answer-input.wrong {
    border-color: var(--red);
    background: var(--red-bg);
    color: var(--red);
  }

  .answer-input:disabled { opacity: 1; }

  .check-btn {
    font-size: 1.15rem;
    padding: 0.65rem 0.9rem;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border2);
    background: var(--text);
    color: var(--bg);
    cursor: pointer;
    transition: opacity 0.15s, background 0.2s, border-color 0.2s;
    white-space: nowrap;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .check-btn:hover { opacity: 0.85; }
  .check-btn.go-green { background: var(--green); border-color: var(--green); }
  .check-btn.go-red { background: var(--red); border-color: var(--red); }

  .feedback {
    margin-top: 1rem;
    font-size: 0.8rem;
    min-height: 18px;
    line-height: 1.5;
  }

  .feedback.ok { color: var(--green); }
  .feedback.err { color: var(--red); }

  .example {
    font-size: 0.78rem;
    color: var(--text2);
    font-style: italic;
    margin-top: 0.5rem;
    padding-top: 0.75rem;
    border-top: 1px dashed var(--border);
    line-height: 1.55;
  }

  .pron-tag {
    display: inline-block;
    font-size: 0.7rem;
    background: var(--accent-bg);
    color: var(--accent);
    border: 1px solid #E8C97A;
    border-radius: 999px;
    padding: 2px 10px;
    letter-spacing: 0.04em;
    margin-left: 8px;
    vertical-align: middle;
  }

  .controls {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .ctrl-btn {
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    color: var(--text3);
    background: none;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.4rem 0.8rem;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: all 0.15s;
    text-transform: uppercase;
  }

  .ctrl-btn:hover { background: var(--surface); color: var(--text2); border-color: var(--border2); }

  .done-screen { text-align: center; padding: 3rem 1rem; }

  .done-screen h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.8rem;
    color: var(--text);
    margin-bottom: 0.5rem;
  }

  .done-screen p {
    font-size: 0.8rem;
    color: var(--text2);
    margin-bottom: 2rem;
    letter-spacing: 0.04em;
  }

  .result-stats {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    margin: 1.25rem 0 1.5rem;
  }

  .result-stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.9rem 0.75rem;
  }

  .result-stat-num {
    font-family: 'DM Serif Display', serif;
    font-size: 1.55rem;
    line-height: 1;
    color: var(--text);
  }

  .result-stat-num.green { color: var(--green); }
  .result-stat-num.red { color: var(--red); }

  .result-stat-lbl {
    font-size: 0.65rem;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 0.35rem;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  .answer-input.shake { animation: shake 0.4s ease; }
</style>
</head>
<body>

<header>
  <h1>Advérbios em <em>Português</em></h1>
  <p><a href="index.html">verbs</a> · <a href="passado.html">passado</a> · <a href="numbers_dates.html">numbers &amp; dates</a> · <a href="connecting.html">connecting words</a> · <a href="glossary.html">glossary</a> · <a href="nouns.html">nouns</a> · <a href="adjectives.html">adjectives</a> · <a class="active" href="adverbs.html">adverbs</a> · <a href="sentences.html">sentences</a></p>
</header>

<div class="container">
  <div id="practiceChrome">
    <div class="filters" id="filterRow"></div>

    <div class="stats" id="statsRow">
      <div class="stat"><div class="stat-num" id="statTotal">0</div><div class="stat-lbl">Total</div></div>
      <div class="stat"><div class="stat-num green" id="statKnown">0</div><div class="stat-lbl">Known</div></div>
      <div class="stat"><div class="stat-num red" id="statLeft">0</div><div class="stat-lbl">Left</div></div>
    </div>

    <div class="progress-row">
      <div class="progress-bg"><div class="progress-fill" id="progressBar" style="width:0%"></div></div>
      <span class="progress-pct" id="progressPct">0%</span>
    </div>
  </div>

  <div id="cardArea"></div>
</div>

<script>
const ALL_CARDS = [
  { en: "now", pt: "agora", pronIpa: "[a'gɔɾɐ]", pronHint: "ah-GOH-rah", example: "Eu preciso sair agora.", exampleEn: "I need to leave now.", group: "time", note: "One of the most useful time words in everyday speech." },
  { en: "already", pt: "já", pronIpa: "[ʒa]", pronHint: "ZHAH", example: "Eu já sei.", exampleEn: "I already know.", group: "time", note: "Short, frequent, and essential for everyday conversation." },
  { en: "still / yet", pt: "ainda", pronIpa: "[a'ĩdɐ]", pronHint: "ah-EEN-dah", example: "Eu ainda estou em casa.", exampleEn: "I am still at home.", group: "time", note: "Very common in both positive and negative sentences: ainda não = not yet." },
  { en: "later / afterwards", pt: "depois", pronIpa: "[de'pojs]", pronHint: "deh-POYSS", example: "A gente conversa depois.", exampleEn: "We will talk later.", group: "time", note: "A core word for postponing something or sequencing events." },
  { en: "today", pt: "hoje", pronIpa: "['oʒi]", pronHint: "OH-zhee", example: "Eu trabalho hoje.", exampleEn: "I work today.", group: "time", note: "A very basic everyday time word." },
  { en: "tomorrow", pt: "amanhã", pronIpa: "[amɐ'ɲɐ̃]", pronHint: "ah-mah-NYAHNG", example: "Eu volto amanhã.", exampleEn: "I will come back tomorrow.", group: "time", note: "One of the first time words learners need for making plans." },
  { en: "yesterday", pt: "ontem", pronIpa: "['õtẽj̃]", pronHint: "OHN-teng", example: "Ontem eu cheguei tarde.", exampleEn: "Yesterday I arrived late.", group: "time", note: "Very useful for basic past-time reference." },
  { en: "soon", pt: "logo", pronIpa: "['lɔgu]", pronHint: "LOH-goo", example: "Eu volto logo.", exampleEn: "I will be back soon.", group: "time", note: "In Brazil, logo often means soon rather than immediately." },

  { en: "always", pt: "sempre", pronIpa: "['sẽpɾi]", pronHint: "SEHM-pree", example: "Ela sempre estuda de manhã.", exampleEn: "She always studies in the morning.", group: "frequency", note: "Great for habits and routines." },
  { en: "never", pt: "nunca", pronIpa: "['nũkɐ]", pronHint: "NOON-kah", example: "Eu nunca bebo café à noite.", exampleEn: "I never drink coffee at night.", group: "frequency", note: "Often pairs naturally with não in full sentences: eu nunca faço isso." },
  { en: "sometimes", pt: "às vezes", pronIpa: "[az 'vezis]", pronHint: "ahz VEH-zees", example: "Às vezes eu tomo café de manhã.", exampleEn: "Sometimes I drink coffee in the morning.", group: "frequency", note: "A high-value frequency phrase that learners need early." },
  { en: "usually / generally", pt: "geralmente", pronIpa: "[ʒeɾaw'mẽtʃi]", pronHint: "zheh-row-MEN-chee", example: "Eu geralmente almoço em casa.", exampleEn: "I usually have lunch at home.", group: "frequency", note: "A little more formal than sempre or às vezes, but very common." },

  { en: "here", pt: "aqui", pronIpa: "[a'ki]", pronHint: "ah-KEE", example: "Pode sentar aqui.", exampleEn: "You can sit here.", group: "place", note: "Aqui points to where you are." },
  { en: "there / over there", pt: "lá", pronIpa: "[la]", pronHint: "LAH", example: "O mercado fica lá.", exampleEn: "The market is over there.", group: "place", note: "Lá usually feels farther away than ali." },
  { en: "there, nearby", pt: "ali", pronIpa: "[a'li]", pronHint: "ah-LEE", example: "O banco fica ali.", exampleEn: "The bank is right there.", group: "place", note: "Ali usually feels closer or more visible than lá." },
  { en: "far away", pt: "longe", pronIpa: "['lõʒi]", pronHint: "LOHN-zhee", example: "O aeroporto fica longe.", exampleEn: "The airport is far away.", group: "place", note: "A useful word for distance, places, and relationships." },
  { en: "near / nearby", pt: "perto", pronIpa: "['pɛʁtu]", pronHint: "PEHR-too", example: "O mercado fica perto daqui.", exampleEn: "The market is near here.", group: "place", note: "Often appears with de: perto de casa, perto daqui." },

  { en: "well", pt: "bem", pronIpa: "[bẽj̃]", pronHint: "BEHNG", example: "Você fala bem português.", exampleEn: "You speak Portuguese well.", group: "manner", note: "Use bem to say someone does something well." },
  { en: "fast / quickly", pt: "rápido", pronIpa: "['ʁapidu]", pronHint: "HAH-pee-doo", example: "Fala mais rápido, por favor.", exampleEn: "Speak faster, please.", group: "manner", note: "Rápido is also an adjective, but in Brazilian speech it is very commonly used adverbially like this." },
  { en: "slowly", pt: "devagar", pronIpa: "[deva'gaʁ]", pronHint: "deh-vah-GAHR", example: "Vai devagar.", exampleEn: "Go slowly.", group: "manner", note: "A very natural everyday adverb for movement, speaking, and pace." },
  { en: "like this / this way", pt: "assim", pronIpa: "[a'sĩ]", pronHint: "ah-SEENG", example: "Não fala assim comigo.", exampleEn: "Do not talk to me like that.", group: "manner", note: "Very common for showing manner, attitude, or way of doing something." },
  { en: "better", pt: "melhor", pronIpa: "[me'ʎɔʁ]", pronHint: "meh-LYOHR", example: "Agora eu entendo melhor.", exampleEn: "Now I understand better.", group: "manner", note: "The comparative adverb form of bem." },
  { en: "worse", pt: "pior", pronIpa: "[pi'oʁ]", pronHint: "pee-OHR", example: "Sem café, eu trabalho pior.", exampleEn: "Without coffee, I perform worse.", group: "manner", note: "The comparative adverb form of mal." },

  { en: "very / a lot", pt: "muito", pronIpa: "['mũjtu]", pronHint: "MOOY-too", example: "Hoje está muito quente.", exampleEn: "Today it is very hot.", group: "degree", note: "Muito works as very before adjectives and adverbs, and as a lot in other contexts." },
  { en: "almost", pt: "quase", pronIpa: "['kwazi]", pronHint: "KWAH-zee", example: "Eu quase perdi o ônibus.", exampleEn: "I almost missed the bus.", group: "degree", note: "A very useful word for near-events and near-misses." },
  { en: "too much / excessively", pt: "demais", pronIpa: "[dʒi'majs]", pronHint: "jee-MYSS", example: "Ele fala demais.", exampleEn: "He talks too much.", group: "degree", note: "Often follows the word it modifies: caro demais, fala demais." },

  { en: "maybe / perhaps", pt: "talvez", pronIpa: "[taw'ves]", pronHint: "tahl-VEZ", example: "Talvez eu vá amanhã.", exampleEn: "Maybe I will go tomorrow.", group: "stance & sequence", note: "A core word for uncertainty and softening statements." },
  { en: "then / so", pt: "então", pronIpa: "[ẽ'tɐ̃w̃]", pronHint: "ehn-TOWNG", example: "Então vamos começar.", exampleEn: "So let us begin.", group: "stance & sequence", note: "Então often works like then in sequence and like so in conversation." }
];

const GROUPS = ["time", "frequency", "place", "manner", "degree", "stance & sequence"];
let activeGroups = new Set(GROUPS);
let deck = [];
let current = 0;
let known = new Set();
let answered = false;
let perfect = true;
let stats = { errors: 0, firstTry: 0 };

function normalize(str) {
  return str.trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[?!.,;:]+/g, "")
    .replace(/\s+/g, " ");
}

function shuffle(arr) {
  return [...arr].sort(() => Math.random() - 0.5);
}

function escapeHtml(str) {
  return str
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function buildDeck() {
  deck = shuffle(ALL_CARDS.filter(card => activeGroups.has(card.group)));
  current = 0;
  known = new Set();
  answered = false;
  perfect = true;
  stats = { errors: 0, firstTry: 0 };
  render();
}

function toggleGroup(group) {
  if (activeGroups.has(group)) {
    if (activeGroups.size === 1) return;
    activeGroups.delete(group);
  } else {
    activeGroups.add(group);
  }
  renderFilters();
  buildDeck();
}

function renderFilters() {
  const row = document.getElementById("filterRow");
  row.innerHTML = GROUPS.map(group => {
    const safeGroup = group.replace(/\\/g, "\\\\").replace(/'/g, "\\'");
    return `<button class="fc-tag ${activeGroups.has(group) ? "active" : ""}" onclick="toggleGroup('${safeGroup}')">${escapeHtml(group)}</button>`;
  }).join("");
}

function updateStats() {
  const total = deck.length;
  const knownCount = known.size;
  const pct = total > 0 ? Math.round((knownCount / total) * 100) : 0;

  document.getElementById("statTotal").textContent = total;
  document.getElementById("statKnown").textContent = knownCount;
  document.getElementById("statLeft").textContent = total - knownCount;
  document.getElementById("progressBar").style.width = pct + "%";
  document.getElementById("progressPct").textContent = pct + "%";
}

function buildReveal(card) {
  return `
    <div class="example">"${escapeHtml(card.example)}"</div>
  `;
}

function render() {
  updateStats();
  const area = document.getElementById("cardArea");
  const remaining = deck.filter((_, i) => !known.has(i));

  if (deck.length === 0) {
    area.innerHTML = `
      <div class="card done-screen">
        <h2>No matching cards</h2>
        <p>Pick at least one adverb group to keep practicing.</p>
      </div>
    `;
    return;
  }

  if (remaining.length === 0) {
    const title = perfect ? "Perfeito!" : "Deck complete!";
    const subtitle = perfect
      ? `You cleared all ${deck.length} adverb cards without errors.`
      : `You finished all ${deck.length} adverb cards.`;

    area.innerHTML = `
      <div class="card done-screen">
        <h2>${title}</h2>
        <p>${subtitle}</p>
        <div class="result-stats">
          <div class="result-stat">
            <div class="result-stat-num green">${stats.firstTry}</div>
            <div class="result-stat-lbl">First try</div>
          </div>
          <div class="result-stat">
            <div class="result-stat-num red">${stats.errors}</div>
            <div class="result-stat-lbl">Errors made</div>
          </div>
        </div>
        <button class="ctrl-btn" onclick="buildDeck()" style="font-size:0.8rem;padding:0.6rem 1.4rem;">Start over ↺</button>
      </div>
    `;
    return;
  }

  while (known.has(current)) current = (current + 1) % deck.length;
  const card = deck[current];

  area.innerHTML = `
    <div class="card">
      <div class="card-meta">${escapeHtml(card.group)}</div>
      <div class="card-prompt">${escapeHtml(card.en)}</div>
      <div class="card-sub">Type the Portuguese adverb</div>
      <div class="input-row">
        <input class="answer-input" id="answerInput" type="text" placeholder="type here..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
        <button class="check-btn" id="actionBtn" onclick="handleAction()">→</button>
      </div>
      <div class="feedback" id="feedback"></div>
      <div id="revealArea"></div>
    </div>
    <div class="controls">
      <button class="ctrl-btn" onclick="skipCard()">Skip →</button>
      <button class="ctrl-btn" onclick="buildDeck()">Restart ↺</button>
    </div>
  `;

  answered = false;
  const input = document.getElementById("answerInput");
  input.focus();
  input.addEventListener("keydown", event => {
    if (event.key === "Enter") handleAction();
  });
}

function handleAction() {
  if (answered) {
    nextCard();
    return;
  }
  checkAnswer();
}

function checkAnswer() {
  const card = deck[current];
  const input = document.getElementById("answerInput");
  const feedback = document.getElementById("feedback");
  const revealArea = document.getElementById("revealArea");
  const button = document.getElementById("actionBtn");

  if (!input.value.trim()) return;

  answered = true;
  input.disabled = true;

  const correct = normalize(card.pt);
  const given = normalize(input.value);
  const answerDisplay = escapeHtml(card.pt);

  if (given === correct) {
    stats.firstTry++;
    input.classList.add("correct");
    button.classList.add("go-green");
    feedback.className = "feedback ok";
    feedback.innerHTML = `✓ Correct — <strong>${answerDisplay}</strong> <span class="pron-tag">${escapeHtml(card.pronHint)}</span>`;
    revealArea.innerHTML = buildReveal(card);
    known.add(current);
    updateStats();
  } else {
    stats.errors++;
    perfect = false;
    input.classList.add("wrong", "shake");
    button.classList.add("go-red");
    feedback.className = "feedback err";
    feedback.innerHTML = `✗ The answer is <strong>${answerDisplay}</strong> <span class="pron-tag">${escapeHtml(card.pronHint)}</span>`;
    revealArea.innerHTML = buildReveal(card);
    setTimeout(() => input.classList.remove("shake"), 400);
  }

  setTimeout(() => button.focus(), 0);
}

function advanceToNextUnknown() {
  if (deck.length === 0 || known.size === deck.length) {
    answered = false;
    render();
    return;
  }

  current = (current + 1) % deck.length;
  while (known.has(current)) current = (current + 1) % deck.length;
  answered = false;
  render();
}

function nextCard() {
  advanceToNextUnknown();
}

function skipCard() {
  known.add(current);
  updateStats();
  advanceToNextUnknown();
}

renderFilters();
buildDeck();
</script>
</body>
</html>

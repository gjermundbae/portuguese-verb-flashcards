<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portuguese Imperfeito Flashcards</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F5F0E8;
    --surface: #FFFDF7;
    --surface2: #EDE8DC;
    --border: #D4CCBA;
    --border2: #BEB5A0;
    --text: #1A1712;
    --text2: #6B6456;
    --text3: #9E9485;
    --green: #2D6A4F;
    --green-bg: #D8F3DC;
    --green-light: #B7E4C7;
    --red: #7D2B2B;
    --red-bg: #FFE8E8;
    --red-light: #FFCACA;
    --accent: #C4922A;
    --accent-bg: #FFF3DC;
    --radius: 12px;
    --radius-sm: 8px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 4rem;
  }

  header {
    text-align: center;
    margin-bottom: 2.5rem;
  }

  header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 2.4rem;
    color: var(--text);
    letter-spacing: -0.5px;
    line-height: 1.1;
  }

  header h1 em {
    font-style: italic;
    color: var(--accent);
  }

  header p {
    font-size: 0.75rem;
    color: var(--text3);
    margin-top: 0.4rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  header p a {
    color: var(--text3);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.15s, color 0.15s;
    padding-bottom: 1px;
  }

  header p a:hover { color: var(--text2); border-bottom-color: var(--border2); }

  header p a.active { color: var(--text2); border-bottom-color: var(--text3); }

  .container {
    width: 100%;
    max-width: 520px;
  }

  .filters {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 1.5rem;
  }

  .fc-tag {
    font-size: 0.7rem;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text2);
    cursor: pointer;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    transition: all 0.15s;
    font-family: 'DM Mono', monospace;
  }

  .fc-tag:hover { border-color: var(--border2); }

  .fc-tag.active {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 1.25rem;
  }

  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.75rem;
    text-align: center;
  }

  .stat-num {
    font-family: 'DM Serif Display', serif;
    font-size: 1.75rem;
    color: var(--text);
    line-height: 1;
  }

  .stat-num.green { color: var(--green); }
  .stat-num.red { color: var(--red); }

  .stat-lbl {
    font-size: 0.65rem;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 3px;
  }

  .progress-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 1.75rem;
  }

  .progress-bg {
    flex: 1;
    height: 4px;
    background: var(--surface2);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--green);
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  .progress-pct {
    font-size: 0.7rem;
    color: var(--text3);
    min-width: 32px;
    text-align: right;
    letter-spacing: 0.05em;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2rem 1.75rem;
    margin-bottom: 1rem;
    animation: slideIn 0.2s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-meta {
    font-size: 0.65rem;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 0.6rem;
  }

  .card-prompt {
    font-family: 'DM Serif Display', serif;
    font-size: 1.9rem;
    color: var(--text);
    line-height: 1.2;
    margin-bottom: 0.35rem;
  }

  .card-sub {
    font-size: 0.72rem;
    color: var(--text3);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 1.5rem;
  }

  .input-row {
    display: flex;
    gap: 8px;
  }

  .answer-input {
    flex: 1;
    font-family: 'DM Mono', monospace;
    font-size: 1rem;
    padding: 0.65rem 0.9rem;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s, background 0.15s;
  }

  .answer-input:focus {
    border-color: var(--accent);
    background: var(--surface);
  }

  .answer-input.correct {
    border-color: var(--green);
    background: var(--green-bg);
    color: var(--green);
  }

  .answer-input.wrong {
    border-color: var(--red);
    background: var(--red-bg);
    color: var(--red);
  }

  .answer-input:disabled { opacity: 1; }

  .check-btn {
    font-size: 1.15rem;
    padding: 0.65rem 0.9rem;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border2);
    background: var(--text);
    color: var(--bg);
    cursor: pointer;
    transition: opacity 0.15s, background 0.2s, border-color 0.2s;
    white-space: nowrap;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .check-btn:hover { opacity: 0.85; }
  .check-btn.go-green { background: var(--green); border-color: var(--green); }
  .check-btn.go-red { background: var(--red); border-color: var(--red); }

  .feedback {
    margin-top: 1rem;
    font-size: 0.8rem;
    min-height: 18px;
    line-height: 1.5;
  }

  .feedback.ok { color: var(--green); }
  .feedback.err { color: var(--red); }

  .example {
    font-size: 0.78rem;
    color: var(--text2);
    font-style: italic;
    margin-top: 0.5rem;
    padding-top: 0.75rem;
    border-top: 1px dashed var(--border);
  }

  .note {
    font-size: 0.72rem;
    color: var(--text2);
    margin-top: 0.65rem;
    line-height: 1.5;
  }

  .controls {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .ctrl-btn {
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    color: var(--text3);
    background: none;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.4rem 0.8rem;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: all 0.15s;
    text-transform: uppercase;
  }

  .ctrl-btn:hover { background: var(--surface); color: var(--text2); border-color: var(--border2); }

  .done-screen {
    text-align: center;
    padding: 3rem 1rem;
  }

  .done-screen .trophy {
    font-size: 3rem;
    margin-bottom: 1rem;
  }

  .done-screen h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.8rem;
    color: var(--text);
    margin-bottom: 0.5rem;
  }

  .done-screen p {
    font-size: 0.8rem;
    color: var(--text2);
    margin-bottom: 2rem;
    letter-spacing: 0.04em;
  }

  .pron-tag {
    display: inline-block;
    font-size: 0.7rem;
    background: var(--accent-bg);
    color: var(--accent);
    border: 1px solid #E8C97A;
    border-radius: 999px;
    padding: 2px 10px;
    letter-spacing: 0.04em;
    margin-left: 8px;
    vertical-align: middle;
  }

  .fireworks-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 9999;
  }

  .conj-table-wrapper {
    margin-top: 1rem;
    padding: 1rem 1.1rem;
    border-radius: var(--radius-sm);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.35s ease, transform 0.35s ease;
  }

  .conj-table-wrapper.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .conj-table-wrapper.ok {
    background: var(--green-bg);
    border: 1px solid var(--green-light);
  }

  .conj-table-wrapper.err {
    background: var(--red-bg);
    border: 1px solid var(--red-light);
  }

  .conj-table-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 0.6rem;
    font-weight: 500;
  }

  .conj-table-wrapper.ok .conj-table-label,
  .conj-table-wrapper.ok .conj-form {
    color: var(--green);
  }

  .conj-table-wrapper.err .conj-table-label,
  .conj-table-wrapper.err .conj-form {
    color: var(--red);
  }

  .conj-table {
    width: 100%;
    border-collapse: collapse;
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
  }

  .conj-table-wrapper.ok .conj-table tr + tr { border-top: 1px dashed var(--green-light); }
  .conj-table-wrapper.err .conj-table tr + tr { border-top: 1px dashed var(--red-light); }

  .conj-table td { padding: 0.35rem 0; }

  .conj-pronoun {
    color: var(--text3);
    width: 60px;
  }

  .conj-pron {
    color: var(--text3);
    font-size: 0.7rem;
    text-align: right;
  }

  .daily-btn {
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    padding: 8px 16px;
    border-radius: 999px;
    border: 1.5px solid var(--accent);
    background: var(--accent-bg);
    color: var(--accent);
    cursor: pointer;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    transition: all 0.15s;
    margin-bottom: 1.5rem;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .daily-btn:hover { background: var(--accent); color: var(--surface); }

  .mode-row {
    display: flex;
    justify-content: center;
    margin-bottom: 1rem;
  }

  .mode-btn {
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    padding: 8px 16px;
    border-radius: 999px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--text2);
    cursor: pointer;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    transition: all 0.15s ease;
    box-shadow: 0 8px 20px rgba(26, 23, 18, 0.04);
  }

  .mode-btn:hover {
    border-color: var(--border2);
    color: var(--text);
  }

  .mode-btn.active {
    background: var(--text);
    border-color: var(--text);
    color: var(--bg);
    box-shadow: 0 12px 24px rgba(26, 23, 18, 0.12);
  }

  .daily-header {
    text-align: center;
    margin-bottom: 1.25rem;
  }

  .daily-header h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.5rem;
    color: var(--accent);
    margin-bottom: 0.2rem;
  }

  .daily-header .daily-date {
    font-size: 0.7rem;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .daily-progress-dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 1.5rem;
  }

  .daily-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--surface2);
    border: 1px solid var(--border);
    transition: all 0.3s ease;
  }

  .daily-dot.current {
    background: var(--accent);
    border-color: var(--accent);
    transform: scale(1.25);
  }

  .daily-dot.done {
    background: var(--green);
    border-color: var(--green);
  }

  .daily-dot.done-multi {
    background: var(--accent);
    border-color: var(--accent);
  }

  .daily-dot.done-fail {
    background: var(--red);
    border-color: var(--red);
  }

  .daily-counter {
    text-align: center;
    font-size: 0.72rem;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 1rem;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  .answer-input.shake {
    animation: shake 0.4s ease;
  }

  .daily-results {
    text-align: left;
    margin: 1.5rem 0;
  }

  .result-stats {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    margin: 1.25rem 0 1.5rem;
  }

  .result-context {
    font-size: 0.64rem;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin: -0.9rem 0 1rem;
  }

  .result-stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.9rem 0.75rem;
  }

  .result-stat-num {
    font-family: 'DM Serif Display', serif;
    font-size: 1.55rem;
    line-height: 1;
    color: var(--text);
  }

  .result-stat-num.accent { color: var(--accent); }
  .result-stat-num.red { color: var(--red); }

  .result-stat-lbl {
    font-size: 0.65rem;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 0.35rem;
  }

  .result-badges {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    margin: 0 0 1.25rem;
  }

  .result-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 0.45rem 0.85rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text2);
    font-size: 0.7rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .daily-result-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 0;
    font-size: 0.82rem;
  }

  .daily-result-row + .daily-result-row {
    border-top: 1px dashed var(--border);
  }

  .daily-result-num {
    color: var(--text3);
    font-size: 0.7rem;
    min-width: 18px;
  }

  .daily-result-verb {
    color: var(--text2);
    min-width: 80px;
  }

  .daily-result-dots {
    letter-spacing: 2px;
    font-size: 1.1rem;
  }

  .copy-btn {
    font-family: 'DM Mono', monospace;
    font-size: 0.78rem;
    padding: 0.65rem 1.6rem;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--accent);
    background: var(--accent);
    color: var(--surface);
    cursor: pointer;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    transition: all 0.15s;
  }

  .copy-btn:hover { opacity: 0.85; }

  .toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: var(--bg);
    font-family: 'DM Mono', monospace;
    font-size: 0.78rem;
    padding: 0.6rem 1.4rem;
    border-radius: var(--radius);
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
    z-index: 10000;
    letter-spacing: 0.04em;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>

<header>
  <h1>Imperfeito em <em>Português</em></h1>
  <p><a href="index.html">verbs</a> · <a href="passado.html">passado</a> · <a class="active" href="imperfeito.html">imperfeito</a> · <a href="numbers_dates.html">numbers &amp; dates</a> · <a href="connecting.html">connecting words</a> · <a href="glossary.html">glossary</a> · <a href="nouns.html">nouns</a> · <a href="adjectives.html">adjectives</a> · <a href="adverbs.html">adverbs</a> · <a href="sentences.html">sentences</a></p>
</header>

<div class="container">
  <div class="mode-row">
    <button class="mode-btn" id="hardModeBtn" type="button" onclick="toggleHardMode()" aria-pressed="false">Hard mode</button>
  </div>
  <div id="dailyBtnRow" style="text-align:center;">
    <button class="daily-btn" onclick="startDaily()">&#9733; Daily Challenge</button>
  </div>

  <div id="dailyHeader" class="daily-header" style="display:none;"></div>
  <div id="dailyDots" class="daily-progress-dots" style="display:none;"></div>

  <div id="practiceChrome">
    <div class="filters" id="filterRow"></div>

    <div class="stats" id="statsRow">
      <div class="stat"><div class="stat-num" id="statTotal">0</div><div class="stat-lbl">Total</div></div>
      <div class="stat"><div class="stat-num green" id="statKnown">0</div><div class="stat-lbl">Known</div></div>
      <div class="stat"><div class="stat-num red" id="statLeft">0</div><div class="stat-lbl">Left</div></div>
    </div>

    <div class="progress-row">
      <div class="progress-bg"><div class="progress-fill" id="progressBar" style="width:0%"></div></div>
      <span class="progress-pct" id="progressPct">0%</span>
    </div>
  </div>

  <div id="cardArea"></div>
</div>
<div class="toast" id="toast"></div>

<script src="drill-common.js"></script>
<script>
// One block per verb; forms are eu → você → nós → vocês (expanded to ALL_CARDS at load).
const VERB_ENTRIES = [
  { verb:"frequentar", group:"-ar verbs",
    forms:[
      { form:"frequentava", pron:"freh-kwen-TAH-vah", meaning:"I used to frequent / would go to", example:"Quando era criança, eu frequentava aquela praia toda semana." },
      { form:"frequentava", pron:"freh-kwen-TAH-vah", meaning:"you used to frequent / would go to", example:"Você frequentava muito a casa dela?" },
      { form:"frequentávamos", pron:"freh-kwen-TAH-vah-moosh", meaning:"we used to frequent / would go to", example:"Nós frequentávamos o mesmo bar todo sábado." },
      { form:"frequentavam", pron:"freh-kwen-TAH-vahng", meaning:"you all used to frequent / would go to", example:"Vocês frequentavam aquele restaurante antes?" }
    ] },
  { verb:"odiar", group:"-ar verbs",
    forms:[
      { form:"odiava", pron:"oh-djee-AH-vah", meaning:"I used to hate", example:"Eu odiava acordar cedo na escola." },
      { form:"odiava", pron:"oh-djee-AH-vah", meaning:"you used to hate", example:"Você odiava fazer dever de casa?" },
      { form:"odiávamos", pron:"oh-djee-AH-vah-moosh", meaning:"we used to hate", example:"Nós odiávamos chuva no recreio." },
      { form:"odiavam", pron:"oh-djee-AH-vahng", meaning:"you all used to hate", example:"Vocês odiavam aquela professora?" }
    ],
    note:"Present tense odiar is irregular (eu odeio), but the imperfeito is regular -ar." },
  { verb:"escrever", group:"-er verbs",
    forms:[
      { form:"escrevia", pron:"es-kreh-VEE-ah", meaning:"I used to write / was writing", example:"Eu escrevia cartas para a minha avó todo mês." },
      { form:"escrevia", pron:"es-kreh-VEE-ah", meaning:"you used to write / were writing", example:"Você escrevia no diário todo dia?" },
      { form:"escrevíamos", pron:"es-kreh-VEE-ah-moosh", meaning:"we used to write / were writing", example:"Nós escrevíamos as respostas no quadro." },
      { form:"escreviam", pron:"es-kreh-VEE-ahng", meaning:"you all used to write / were writing", example:"Vocês escreviam muito no colégio?" }
    ] },
  { verb:"ler", group:"-er verbs",
    forms:[
      { form:"lia", pron:"LEE-ah", meaning:"I used to read / was reading", example:"Eu lia antes de dormir todo dia." },
      { form:"lia", pron:"LEE-ah", meaning:"you used to read / were reading", example:"Você lia muito quando era criança?" },
      { form:"líamos", pron:"LEE-ah-moosh", meaning:"we used to read / were reading", example:"Nós líamos o jornal de manhã." },
      { form:"liam", pron:"LEE-ahng", meaning:"you all used to read / were reading", example:"Vocês liam revistas em casa?" }
    ] },
  { verb:"decidir", group:"-ir verbs",
    forms:[
      { form:"decidia", pron:"deh-see-DJEE-ah", meaning:"I used to decide / would decide", example:"Eu sempre decidia o que pedir antes de chegar." },
      { form:"decidia", pron:"deh-see-DJEE-ah", meaning:"you used to decide / would decide", example:"Você decidia tudo sozinho?" },
      { form:"decidíamos", pron:"deh-see-DJEE-ah-moosh", meaning:"we used to decide / would decide", example:"Nós decidíamos juntos onde almoçar." },
      { form:"decidiam", pron:"deh-see-DJEE-ahng", meaning:"you all used to decide / would decide", example:"Vocês decidiam rápido ou demorava?" }
    ] },
  { verb:"sugerir", group:"-ir verbs",
    forms:[
      { form:"sugeria", pron:"soo-jeh-REE-ah", meaning:"I used to suggest", example:"Eu sempre sugeria o mesmo restaurante." },
      { form:"sugeria", pron:"soo-jeh-REE-ah", meaning:"you used to suggest", example:"Você sugeria filmes para a gente?" },
      { form:"sugeríamos", pron:"soo-jeh-REE-ah-moosh", meaning:"we used to suggest", example:"Nós sugeríamos lugares para visitar." },
      { form:"sugeriam", pron:"soo-jeh-REE-ahng", meaning:"you all used to suggest", example:"Vocês sugeriam ideias na reunião?" }
    ] },
  { verb:"ser", group:"irregular",
    forms:[
      { form:"era", pron:"EH-rah", meaning:"I was / used to be", example:"Eu era muito tímido quando era criança." },
      { form:"era", pron:"EH-rah", meaning:"you were / used to be", example:"Você era assim antes também?" },
      { form:"éramos", pron:"EH-rah-moosh", meaning:"we were / used to be", example:"Nós éramos vizinhos na infância." },
      { form:"eram", pron:"EH-rahng", meaning:"you all were / used to be", example:"Vocês eram amigos no colégio?" }
    ],
    note:"Ser is one of only four truly irregular verbs in the imperfeito (with ter, vir, pôr)." },
  { verb:"ter", group:"irregular",
    forms:[
      { form:"tinha", pron:"CHEE-nyah", meaning:"I had / used to have", example:"Eu tinha um cachorro quando era pequeno." },
      { form:"tinha", pron:"CHEE-nyah", meaning:"you had / used to have", example:"Você tinha bicicleta quando era criança?" },
      { form:"tínhamos", pron:"CHEE-nyah-moosh", meaning:"we had / used to have", example:"Nós tínhamos uma casa na praia." },
      { form:"tinham", pron:"CHEE-nyahng", meaning:"you all had / used to have", example:"Vocês tinham aula aos sábados?" }
    ] },
  { verb:"vir", group:"irregular",
    forms:[
      { form:"vinha", pron:"VEE-nyah", meaning:"I used to come / was coming", example:"Eu vinha aqui todo domingo." },
      { form:"vinha", pron:"VEE-nyah", meaning:"you used to come / were coming", example:"Você vinha de ônibus antes?" },
      { form:"vínhamos", pron:"VEE-nyah-moosh", meaning:"we used to come / were coming", example:"Nós vínhamos juntos para a aula." },
      { form:"vinham", pron:"VEE-nyahng", meaning:"you all used to come / were coming", example:"Vocês vinham sempre nesse horário?" }
    ] },
  { verb:"pôr", group:"irregular",
    forms:[
      { form:"punha", pron:"POO-nyah", meaning:"I used to put", example:"Eu punha açúcar no café antes." },
      { form:"punha", pron:"POO-nyah", meaning:"you used to put", example:"Você punha tudo na mochila?" },
      { form:"púnhamos", pron:"POO-nyah-moosh", meaning:"we used to put", example:"Nós púnhamos os livros na estante." },
      { form:"punham", pron:"POO-nyahng", meaning:"you all used to put", example:"Vocês punham gelo na água?" }
    ] },
];

const ALL_CARDS = expandVerbEntries(VERB_ENTRIES);

const GROUPS = ["-ar verbs", "-er verbs", "-ir verbs", "irregular"];
let activeGroups = new Set(GROUPS);
let deck = [], current = 0, known = new Set(), answered = false, perfect = true;
let hardMode = false;
let practiceStats = createRunStats();

let dailyMode = false;
let dailyAttempts = [];
let dailyFailed = [];
let dailyCurrent = 0;
let dailyDeck = [];
let dailyStats = createRunStats();
const DAILY_MAX_ATTEMPTS = 5;

const DAILY_EPOCH = new Date(2026, 5, 5);

function dailySeed() {
  const d = new Date();
  return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
}

function seededRandom(seed) {
  return function() {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function getDailyCards() {
  const rng = seededRandom(dailySeed());
  const indices = [];
  while (indices.length < 7) {
    const idx = Math.floor(rng() * ALL_CARDS.length);
    if (!indices.includes(idx)) indices.push(idx);
  }
  return indices.map(i => ALL_CARDS[i]);
}

function getDailyNumber() {
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.floor((today - DAILY_EPOCH) / 86400000);
}

function formatDailyDate() {
  return new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
}

function createRunStats() {
  return { errors: 0, hardModeSolved: 0 };
}

function formatCount(count, singular, plural = `${singular}s`) {
  return `${count} ${count === 1 ? singular : plural}`;
}

function buildPracticeStatsMarkup(stats) {
  return `
    <div class="result-stats">
      <div class="result-stat">
        <div class="result-stat-num accent">${stats.hardModeSolved}</div>
        <div class="result-stat-lbl">Hard mode cards</div>
      </div>
      <div class="result-stat">
        <div class="result-stat-num red">${stats.errors}</div>
        <div class="result-stat-lbl">Errors made</div>
      </div>
    </div>
  `;
}

function buildDailyHardModeBadge(stats) {
  if (!stats.hardModeSolved) return '';
  return `
    <div class="result-badges">
      <div class="result-badge">🥷 ${formatCount(stats.hardModeSolved, 'hard mode card')}</div>
    </div>
  `;
}

function getCardMeta(card) {
  return hardMode ? 'hard mode &mdash; pretérito imperfeito' : `${card.verb} &mdash; pretérito imperfeito`;
}

function updateHardModeButton() {
  const btn = document.getElementById('hardModeBtn');
  if (!btn) return;
  btn.classList.toggle('active', hardMode);
  btn.setAttribute('aria-pressed', hardMode ? 'true' : 'false');
}

function toggleHardMode() {
  hardMode = !hardMode;
  updateHardModeButton();
  if (hardMode) launchHardModeConfetti();
  if (dailyMode) renderDailyCard();
  else render();
}

function startDaily() {
  dailyMode = true;
  dailyDeck = getDailyCards();
  dailyAttempts = new Array(7).fill(0);
  dailyFailed = new Array(7).fill(false);
  dailyCurrent = 0;
  dailyStats = createRunStats();

  document.getElementById('dailyBtnRow').style.display = 'none';
  document.getElementById('practiceChrome').style.display = 'none';
  document.getElementById('dailyHeader').style.display = '';
  document.getElementById('dailyDots').style.display = '';

  document.getElementById('dailyHeader').innerHTML =
    `<h2>&#9733; Daily Challenge #${getDailyNumber()}</h2>` +
    `<div class="daily-date">${formatDailyDate()}</div>`;

  renderDailyCard();
}

function exitDaily() {
  dailyMode = false;
  document.getElementById('dailyBtnRow').style.display = '';
  document.getElementById('practiceChrome').style.display = '';
  document.getElementById('dailyHeader').style.display = 'none';
  document.getElementById('dailyDots').style.display = 'none';
  buildDeck();
}

function renderDailyDots() {
  const dots = document.getElementById('dailyDots');
  dots.innerHTML = dailyDeck.map((_, i) => {
    let cls = 'daily-dot';
    if (i < dailyCurrent) {
      if (dailyFailed[i]) cls += ' done-fail';
      else if (dailyAttempts[i] === 1) cls += ' done';
      else cls += ' done-multi';
    } else if (i === dailyCurrent) {
      cls += ' current';
    }
    return `<div class="${cls}"></div>`;
  }).join('');
}

function renderDailyCard() {
  renderDailyDots();
  const area = document.getElementById('cardArea');

  if (dailyCurrent >= 7) {
    renderDailyComplete();
    return;
  }

  const card = dailyDeck[dailyCurrent];
  const attemptsLeft = DAILY_MAX_ATTEMPTS - dailyAttempts[dailyCurrent];
  area.innerHTML = `
    <div class="daily-counter">Card ${dailyCurrent + 1} of 7 · ${attemptsLeft} ${attemptsLeft === 1 ? 'try' : 'tries'} left</div>
    <div class="card">
      <div class="card-meta">${getCardMeta(card)}</div>
      <div class="card-prompt">${card.meaning}</div>
      <div class="card-sub">Type the conjugation</div>
      <div class="input-row">
        <input class="answer-input" id="answerInput" type="text" placeholder="type here…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
        <button class="check-btn" id="actionBtn" onclick="handleDailyAction()">→</button>
      </div>
      <div class="feedback" id="feedback"></div>
      <div id="revealArea"></div>
    </div>
    <div class="controls">
      <button class="ctrl-btn" onclick="skipDailyCard()">Skip →</button>
      <button class="ctrl-btn" onclick="exitDaily()">← Back to practice</button>
    </div>
  `;

  const input = document.getElementById('answerInput');
  focusAnswerInput(input);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') handleDailyAction();
  });
}

let dailyAnswered = false;

function handleDailyAction() {
  if (dailyAnswered) {
    dailyCurrent++;
    dailyAnswered = false;
    renderDailyCard();
    return;
  }
  checkDailyAnswer();
}

function checkDailyAnswer() {
  const card = dailyDeck[dailyCurrent];
  const input = document.getElementById('answerInput');
  const feedback = document.getElementById('feedback');
  const revealArea = document.getElementById('revealArea');
  const btn = document.getElementById('actionBtn');
  if (!input.value.trim()) return;

  dailyAttempts[dailyCurrent]++;

  if (isVerbConjugationCorrect(card, input.value, normalize)) {
    if (hardMode) dailyStats.hardModeSolved++;
    dailyAnswered = true;
    input.disabled = true;
    input.classList.add('correct');
    btn.classList.add('go-green');
    feedback.className = 'feedback ok';
    const tries = dailyAttempts[dailyCurrent];
    const tryText = tries === 1 ? '1st try!' : `${tries} tries`;
    feedback.innerHTML = `✓ Correct — ${tryText} <span class="pron-tag">${card.pron}</span>`;
    revealArea.innerHTML = buildRevealContent(card, 'ok');
    animateConjugationTable();
    renderDailyDots();
    setTimeout(() => btn.focus(), 0);
  } else {
    dailyStats.errors++;
    if (dailyAttempts[dailyCurrent] >= DAILY_MAX_ATTEMPTS) {
      failDailyCard();
    } else {
      input.classList.add('shake');
      input.classList.add('wrong');
      feedback.className = 'feedback err';
      const left = DAILY_MAX_ATTEMPTS - dailyAttempts[dailyCurrent];
      feedback.textContent = `✗ Not quite — ${left} ${left === 1 ? 'try' : 'tries'} left`;
      setTimeout(() => {
        input.classList.remove('shake', 'wrong');
        input.value = '';
        focusAnswerInput(input);
        feedback.className = 'feedback';
        feedback.textContent = '';
      }, 700);
    }
  }
}

function failDailyCard() {
  const card = dailyDeck[dailyCurrent];
  const input = document.getElementById('answerInput');
  const feedback = document.getElementById('feedback');
  const revealArea = document.getElementById('revealArea');
  const btn = document.getElementById('actionBtn');

  dailyFailed[dailyCurrent] = true;
  dailyAnswered = true;
  input.disabled = true;
  input.classList.add('wrong');
  btn.classList.add('go-red');
  feedback.className = 'feedback err';
  feedback.innerHTML = `✗ The answer was <strong>${card.conj}</strong> <span class="pron-tag">${card.pron}</span>`;
  revealArea.innerHTML = buildRevealContent(card, 'err');
  animateConjugationTable();
  renderDailyDots();
  setTimeout(() => btn.focus(), 0);
}

function skipDailyCard() {
  dailyFailed[dailyCurrent] = true;
  dailyCurrent++;
  dailyAnswered = false;
  renderDailyCard();
}

function buildShareString() {
  const num = getDailyNumber();
  const date = formatDailyDate();
  let lines = [`Portuguese imperfeito! Daily #${num}`, date, 'Imperfect past', ''];

  dailyDeck.forEach((card, i) => {
    const dots = buildResultDots(dailyAttempts[i], dailyFailed[i]);
    lines.push(`${card.verb} → ${dots}`);
  });

  const solved = dailyFailed.filter(f => !f).length;
  const firstTry = dailyAttempts.filter((a, i) => a === 1 && !dailyFailed[i]).length;
  lines.push('');
  lines.push(`${solved}/7 solved · ${firstTry} first try!`);
  if (dailyStats.hardModeSolved > 0) {
    lines.push(`🥷 ${formatCount(dailyStats.hardModeSolved, 'hard mode card')}`);
  }
  lines.push('');
  lines.push('Play → gjermundbae.github.io/portuguese-verb-flashcards/imperfeito.html#daily');
  return lines.join('\n');
}

function buildResultDots(attempts, failed) {
  if (failed) {
    return '🟡'.repeat(attempts) + '🔴';
  } else if (attempts === 1) {
    return '🟢';
  } else {
    return '🟡'.repeat(attempts - 1) + '🟢';
  }
}

function renderDailyComplete() {
  renderDailyDots();
  const area = document.getElementById('cardArea');
  const allFirstTry = dailyAttempts.every(a => a === 1) && dailyFailed.every(f => !f);
  const solvedCount = dailyFailed.filter(f => !f).length;
  const firstTryCount = dailyAttempts.filter((a, i) => a === 1 && !dailyFailed[i]).length;
  const usedHardMode = dailyStats.hardModeSolved > 0;

  const rows = dailyDeck.map((card, i) => {
    const dots = buildResultDots(dailyAttempts[i], dailyFailed[i]);
    return `<div class="daily-result-row">
      <span class="daily-result-num">${i + 1}.</span>
      <span class="daily-result-verb">${card.verb}</span>
      <span class="daily-result-dots">${dots}</span>
    </div>`;
  }).join('');

  const allSolved = solvedCount === 7;
  let title, trophy, subtitle;
  if (allFirstTry) {
    title = 'Perfeito!';
    trophy = usedHardMode ? '🥷' : '🎆';
    subtitle = 'All 7 on the first try. Incredible!';
  } else if (allSolved) {
    title = 'Challenge Complete!';
    trophy = usedHardMode ? '🥷' : '🏆';
    subtitle = `${solvedCount}/7 solved · ${firstTryCount} first try`;
  } else {
    title = 'Challenge Complete';
    trophy = usedHardMode ? '🥷' : '💪';
    subtitle = `${solvedCount}/7 solved · ${firstTryCount} first try`;
  }

  area.innerHTML = `
    <div class="card done-screen">
      <div class="trophy">${trophy}</div>
      <h2>${title}</h2>
      <p>${subtitle}</p>
      <div class="result-context">Imperfect past</div>
      ${buildDailyHardModeBadge(dailyStats)}
      <div class="daily-results">${rows}</div>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
        <button class="copy-btn" onclick="copyDailyResults()">Copy results</button>
        <button class="ctrl-btn" onclick="exitDaily()" style="font-size:0.78rem;padding:0.6rem 1.2rem;">Practice all cards</button>
      </div>
    </div>
  `;

  if (allFirstTry) launchFireworks();
}

function copyDailyResults() {
  const text = buildShareString();
  navigator.clipboard.writeText(text).then(() => {
    showToast('Copied to clipboard!');
  }).catch(() => {
    showToast('Could not copy');
  });
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

function buildRevealContent(card, tone) {
  const note = card.note ? `<div class="note">${card.note}</div>` : '';
  return `<div class="example">"${card.example}"</div>${note}${buildConjugationTable(card.verb, tone)}`;
}

function animateConjugationTable() {
  requestAnimationFrame(() => {
    const el = document.querySelector('.conj-table-wrapper');
    if (el) el.classList.add('visible');
  });
}

function normalize(str) {
  return str.trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/\s+/g, " ");
}

function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

function getFilteredCards() {
  return ALL_CARDS.filter(card => activeGroups.has(card.group));
}

function buildDeck() {
  deck = shuffle(getFilteredCards());
  current = 0;
  known = new Set();
  answered = false;
  perfect = true;
  practiceStats = createRunStats();
  render();
}

function updateStats() {
  const total = deck.length;
  const knownCount = known.size;
  const pct = total > 0 ? Math.round((knownCount / total) * 100) : 0;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statKnown').textContent = knownCount;
  document.getElementById('statLeft').textContent = total - knownCount;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressPct').textContent = pct + '%';
}

function render() {
  updateStats();
  const area = document.getElementById('cardArea');
  const remaining = deck.filter((_, i) => !known.has(i));

  if (deck.length === 0) {
    area.innerHTML = `
      <div class="card done-screen">
        <h2>No matching cards</h2>
        <p>No cards match the current filters.</p>
      </div>
    `;
    return;
  }

  if (remaining.length === 0 && deck.length > 0) {
    const title = perfect ? 'Perfeito!' : 'Deck complete!';
    const subtitle = perfect
      ? `You cleared all ${deck.length} cards.`
      : `You finished all ${deck.length} cards.`;
    area.innerHTML = `
      <div class="card done-screen">
        <div class="trophy">${perfect ? '🎆' : '🏆'}</div>
        <h2>${title}</h2>
        <p>${subtitle}</p>
        ${buildPracticeStatsMarkup(practiceStats)}
        <button class="ctrl-btn" onclick="buildDeck()" style="font-size:0.8rem;padding:0.6rem 1.4rem;">Start over ↺</button>
      </div>`;
    if (perfect) launchFireworks();
    return;
  }

  while (known.has(current)) current = (current + 1) % deck.length;
  const card = deck[current];

  area.innerHTML = `
    <div class="card">
      <div class="card-meta">${getCardMeta(card)}</div>
      <div class="card-prompt">${card.meaning}</div>
      <div class="card-sub">Type the conjugation (e.g. eu falei or falei)</div>
      <div class="input-row">
        <input class="answer-input" id="answerInput" type="text" placeholder="type here…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
        <button class="check-btn" id="actionBtn" onclick="handleAction()">→</button>
      </div>
      <div class="feedback" id="feedback"></div>
      <div id="revealArea"></div>
    </div>
    <div class="controls">
      <button class="ctrl-btn" onclick="skipCard()">Skip →</button>
      <button class="ctrl-btn" onclick="buildDeck()">Restart ↺</button>
    </div>
  `;

  answered = false;
  const input = document.getElementById('answerInput');
  focusAnswerInput(input);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') handleAction();
  });
}

function handleAction() {
  if (answered) { nextCard(); return; }
  checkAnswer();
}

function checkAnswer() {
  const card = deck[current];
  const input = document.getElementById('answerInput');
  const feedback = document.getElementById('feedback');
  const revealArea = document.getElementById('revealArea');
  const btn = document.getElementById('actionBtn');
  if (!input.value.trim()) return;

  answered = true;
  input.disabled = true;

  if (isVerbConjugationCorrect(card, input.value, normalize)) {
    if (hardMode) practiceStats.hardModeSolved++;
    input.classList.add('correct');
    btn.classList.add('go-green');
    feedback.className = 'feedback ok';
    feedback.innerHTML = `✓ Correct! <span class="pron-tag">${card.pron}</span>`;
    revealArea.innerHTML = buildRevealContent(card, 'ok');
    known.add(current);
    updateStats();
  } else {
    practiceStats.errors++;
    perfect = false;
    input.classList.add('wrong');
    btn.classList.add('go-red');
    feedback.className = 'feedback err';
    feedback.innerHTML = `✗ The answer is <strong>${card.conj}</strong> <span class="pron-tag">${card.pron}</span>`;
    revealArea.innerHTML = buildRevealContent(card, 'err');
  }

  animateConjugationTable();
  setTimeout(() => btn.focus(), 0);
}

function buildConjugationTable(verb, tone) {
  const forms = ALL_CARDS.filter(c => c.verb === verb);
  const rows = forms.map(f =>
    `<tr><td class="conj-pronoun">${f.person}</td><td class="conj-form">${f.form}</td><td class="conj-pron">${f.pron}</td></tr>`
  ).join('');
  return `<div class="conj-table-wrapper ${tone}"><div class="conj-table-label">${verb} — pretérito imperfeito</div><table class="conj-table">${rows}</table></div>`;
}

function advanceToNextUnknown() {
  if (deck.length === 0 || known.size === deck.length) {
    answered = false;
    render();
    return;
  }

  current = (current + 1) % deck.length;
  while (known.has(current)) current = (current + 1) % deck.length;
  answered = false;
  render();
}

function nextCard() {
  advanceToNextUnknown();
}

function skipCard() {
  known.add(current);
  updateStats();
  advanceToNextUnknown();
}

function renderFilters() {
  const groupTags = GROUPS.map(g =>
    `<div class="fc-tag${activeGroups.has(g) ? ' active' : ''}" onclick="toggleGroup('${g}')">${g}</div>`
  ).join('');
  document.getElementById('filterRow').innerHTML = groupTags;
}

function toggleGroup(g) {
  if (activeGroups.has(g)) {
    if (activeGroups.size === 1) return;
    activeGroups.delete(g);
  } else {
    activeGroups.add(g);
  }
  renderFilters();
  buildDeck();
}

function launchFireworks() {
  const canvas = document.createElement('canvas');
  canvas.className = 'fireworks-canvas';
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  let W, H;
  function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);

  const particles = [];
  const colors = ['#C4922A','#2D6A4F','#7D2B2B','#E8C97A','#B7E4C7','#FFCACA','#6B6456','#F5F0E8'];

  function burst(x, y) {
    const count = 50 + Math.random() * 30;
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * 5;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: 0.012 + Math.random() * 0.012,
        color: colors[Math.floor(Math.random() * colors.length)],
        size: 2 + Math.random() * 3,
      });
    }
  }

  let bursts = 0, maxBursts = 6;
  function scheduleBurst() {
    if (bursts >= maxBursts) return;
    burst(W * (0.2 + Math.random() * 0.6), H * (0.15 + Math.random() * 0.45));
    bursts++;
    setTimeout(scheduleBurst, 250 + Math.random() * 350);
  }
  scheduleBurst();

  function frame() {
    ctx.clearRect(0, 0, W, H);
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.06;
      p.vx *= 0.99;
      p.life -= p.decay;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (particles.length > 0 || bursts < maxBursts) {
      requestAnimationFrame(frame);
    } else {
      canvas.remove();
    }
  }
  requestAnimationFrame(frame);
}

function launchHardModeConfetti() {
  const canvas = document.createElement('canvas');
  canvas.className = 'fireworks-canvas';
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  let W, H;
  function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);

  const particles = [];
  const colors = ['#C4922A', '#E8C97A', '#2D6A4F', '#B7E4C7', '#FFF3DC'];

  for (let burst = 0; burst < 3; burst++) {
    const originX = W * (0.25 + Math.random() * 0.5);
    const originY = H * (0.16 + Math.random() * 0.18);
    for (let i = 0; i < 36; i++) {
      const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.4;
      const speed = 2 + Math.random() * 4;
      particles.push({
        x: originX,
        y: originY,
        vx: Math.cos(angle) * speed + (Math.random() - 0.5) * 2,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: 0.015 + Math.random() * 0.015,
        color: colors[Math.floor(Math.random() * colors.length)],
        size: 5 + Math.random() * 6,
        tilt: Math.random() * Math.PI,
        spin: (Math.random() - 0.5) * 0.25,
      });
    }
  }

  function frame() {
    ctx.clearRect(0, 0, W, H);
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.09;
      p.vx *= 0.992;
      p.life -= p.decay;
      p.tilt += p.spin;

      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }

      ctx.save();
      ctx.globalAlpha = p.life;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.tilt);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.66);
      ctx.restore();
    }

    if (particles.length > 0) {
      requestAnimationFrame(frame);
    } else {
      canvas.remove();
    }
  }

  requestAnimationFrame(frame);
}

renderFilters();
updateHardModeButton();
buildDeck();
if (window.location.hash === '#daily') startDaily();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portuguese Adjective Flashcards</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F5F0E8;
    --surface: #FFFDF7;
    --surface2: #EDE8DC;
    --border: #D4CCBA;
    --border2: #BEB5A0;
    --text: #1A1712;
    --text2: #6B6456;
    --text3: #9E9485;
    --green: #2D6A4F;
    --green-bg: #D8F3DC;
    --red: #7D2B2B;
    --red-bg: #FFE8E8;
    --accent: #C4922A;
    --accent-bg: #FFF3DC;
    --radius: 12px;
    --radius-sm: 8px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 4rem;
  }

  header { text-align: center; margin-bottom: 2.5rem; }

  header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 2.4rem;
    color: var(--text);
    letter-spacing: -0.5px;
    line-height: 1.1;
  }

  header h1 em { font-style: italic; color: var(--accent); }

  header p {
    font-size: 0.75rem;
    color: var(--text3);
    margin-top: 0.4rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  header p a {
    color: var(--text3);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.15s, color 0.15s;
    padding-bottom: 1px;
  }

  header p a:hover { color: var(--text2); border-bottom-color: var(--border2); }
  header p a.active { color: var(--text2); border-bottom-color: var(--text3); }

  .container { width: 100%; max-width: 520px; }

  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1.5rem; }

  .fc-tag {
    font-size: 0.7rem;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text2);
    cursor: pointer;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    transition: all 0.15s;
    font-family: 'DM Mono', monospace;
  }

  .fc-tag:hover { border-color: var(--border2); }

  .fc-tag.active {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 1.25rem;
  }

  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.75rem;
    text-align: center;
  }

  .stat-num {
    font-family: 'DM Serif Display', serif;
    font-size: 1.75rem;
    color: var(--text);
    line-height: 1;
  }

  .stat-num.green { color: var(--green); }
  .stat-num.red { color: var(--red); }

  .stat-lbl {
    font-size: 0.65rem;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 3px;
  }

  .progress-row { display: flex; align-items: center; gap: 10px; margin-bottom: 1.75rem; }

  .progress-bg {
    flex: 1;
    height: 4px;
    background: var(--surface2);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--green);
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  .progress-pct {
    font-size: 0.7rem;
    color: var(--text3);
    min-width: 32px;
    text-align: right;
    letter-spacing: 0.05em;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2rem 1.75rem;
    margin-bottom: 1rem;
    animation: slideIn 0.2s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-meta {
    font-size: 0.65rem;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 0.6rem;
  }

  .card-prompt {
    font-family: 'DM Serif Display', serif;
    font-size: 1.9rem;
    color: var(--text);
    line-height: 1.2;
    margin-bottom: 0.35rem;
  }

  .card-sub {
    font-size: 0.72rem;
    color: var(--text3);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 1.5rem;
  }

  .input-row { display: flex; gap: 8px; }

  .answer-input {
    flex: 1;
    font-family: 'DM Mono', monospace;
    font-size: 1rem;
    padding: 0.65rem 0.9rem;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s, background 0.15s;
  }

  .answer-input:focus { border-color: var(--accent); background: var(--surface); }

  .answer-input.correct {
    border-color: var(--green);
    background: var(--green-bg);
    color: var(--green);
  }

  .answer-input.wrong {
    border-color: var(--red);
    background: var(--red-bg);
    color: var(--red);
  }

  .answer-input:disabled { opacity: 1; }

  .check-btn {
    font-size: 1.15rem;
    padding: 0.65rem 0.9rem;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border2);
    background: var(--text);
    color: var(--bg);
    cursor: pointer;
    transition: opacity 0.15s, background 0.2s, border-color 0.2s;
    white-space: nowrap;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .check-btn:hover { opacity: 0.85; }
  .check-btn.go-green { background: var(--green); border-color: var(--green); }
  .check-btn.go-red { background: var(--red); border-color: var(--red); }

  .feedback {
    margin-top: 1rem;
    font-size: 0.8rem;
    min-height: 18px;
    line-height: 1.5;
  }

  .feedback.ok { color: var(--green); }
  .feedback.err { color: var(--red); }

  .example {
    font-size: 0.78rem;
    color: var(--text2);
    font-style: italic;
    margin-top: 0.5rem;
    padding-top: 0.75rem;
    border-top: 1px dashed var(--border);
    line-height: 1.55;
  }

  .example-text {
    display: block;
  }

  .example-translation {
    display: block;
    margin-top: 0.4rem;
    color: var(--text3);
    font-style: normal;
  }

  .pron-tag {
    display: inline-block;
    font-size: 0.7rem;
    background: var(--accent-bg);
    color: var(--accent);
    border: 1px solid #E8C97A;
    border-radius: 999px;
    padding: 2px 10px;
    letter-spacing: 0.04em;
    margin-left: 8px;
    vertical-align: middle;
  }

  .controls {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .ctrl-btn {
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    color: var(--text3);
    background: none;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.4rem 0.8rem;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: all 0.15s;
    text-transform: uppercase;
  }

  .ctrl-btn:hover { background: var(--surface); color: var(--text2); border-color: var(--border2); }

  .done-screen { text-align: center; padding: 3rem 1rem; }

  .done-screen h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.8rem;
    color: var(--text);
    margin-bottom: 0.5rem;
  }

  .done-screen p {
    font-size: 0.8rem;
    color: var(--text2);
    margin-bottom: 2rem;
    letter-spacing: 0.04em;
  }

  .result-stats {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    margin: 1.25rem 0 1.5rem;
  }

  .result-stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.9rem 0.75rem;
  }

  .result-stat-num {
    font-family: 'DM Serif Display', serif;
    font-size: 1.55rem;
    line-height: 1;
    color: var(--text);
  }

  .result-stat-num.green { color: var(--green); }
  .result-stat-num.red { color: var(--red); }

  .result-stat-lbl {
    font-size: 0.65rem;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 0.35rem;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  .answer-input.shake { animation: shake 0.4s ease; }
</style>
</head>
<body>

<header>
  <h1>Adjetivos em <em>Português</em></h1>
  <p><a href="index.html">verbs</a> · <a href="passado.html">passado</a> · <a href="numbers_dates.html">numbers &amp; dates</a> · <a href="connecting.html">connecting words</a> · <a href="glossary.html">glossary</a> · <a href="nouns.html">nouns</a> · <a class="active" href="adjectives.html">adjectives</a> · <a href="adverbs.html">adverbs</a> · <a href="sentences.html">sentences</a></p>
</header>

<div class="container">
  <div id="practiceChrome">
    <div class="filters" id="filterRow"></div>

    <div class="stats" id="statsRow">
      <div class="stat"><div class="stat-num" id="statTotal">0</div><div class="stat-lbl">Total</div></div>
      <div class="stat"><div class="stat-num green" id="statKnown">0</div><div class="stat-lbl">Known</div></div>
      <div class="stat"><div class="stat-num red" id="statLeft">0</div><div class="stat-lbl">Left</div></div>
    </div>

    <div class="progress-row">
      <div class="progress-bg"><div class="progress-fill" id="progressBar" style="width:0%"></div></div>
      <span class="progress-pct" id="progressPct">0%</span>
    </div>
  </div>

  <div id="cardArea"></div>
</div>

<script>
const ALL_CARDS = [
  { en: "good", pt: "bom", alts: ["boa"], agreement: "fem.: boa", pronIpa: "[bõ]", pronHint: "BOHNG", example: "A comida aqui é boa.", exampleEn: "The food here is good.", group: "quality" },
  { en: "bad", pt: "ruim", agreement: "same form", pronIpa: "[ʁu'ĩ]", pronHint: "hoo-EENG", example: "O tempo está ruim hoje.", exampleEn: "The weather is bad today.", group: "quality" },
  { en: "beautiful", pt: "bonito", alts: ["bonita"], agreement: "fem.: bonita", pronIpa: "[bo'nitu]", pronHint: "boh-NEE-too", example: "Que cidade bonita!", exampleEn: "What a beautiful city!", group: "quality" },
  { en: "cool / nice", pt: "legal", agreement: "same form", pronIpa: "[le'gaw]", pronHint: "leh-GAHL", example: "Seu professor é muito legal.", exampleEn: "Your teacher is very nice.", group: "quality" },
  { en: "intelligent", pt: "inteligente", agreement: "same form", pronIpa: "[ĩteli'ʒẽtʃi]", pronHint: "een-teh-lee-ZHEN-chee", example: "Você é muito inteligente.", exampleEn: "You are very intelligent.", group: "quality" },
  { en: "delicious", pt: "delicioso", alts: ["deliciosa"], agreement: "fem.: deliciosa", pronIpa: "[dʒe.li.si'o.zu]", pronHint: "jee-lee-see-OH-zoo", example: "A sobremesa está deliciosa.", exampleEn: "The dessert is delicious.", group: "quality" },
  { en: "excellent", pt: "excelente", agreement: "same form", pronIpa: "[ese'lẽtʃi]", pronHint: "eh-seh-LEN-chee", example: "A ideia é excelente.", exampleEn: "The idea is excellent.", group: "quality" },
  { en: "interesting", pt: "interessante", agreement: "same form", pronIpa: "[ĩteɾe'sɐ̃tʃi]", pronHint: "een-teh-reh-SAHN-chee", example: "O livro é interessante.", exampleEn: "The book is interesting.", group: "quality" },
  { en: "funny", pt: "engraçado", alts: ["engraçada"], agreement: "fem.: engraçada", pronIpa: "[ẽgɾa'sadu]", pronHint: "eng-grah-SAH-doo", example: "O filme é engraçado.", exampleEn: "The movie is funny.", group: "quality" },
  { en: "different", pt: "diferente", agreement: "same form", pronIpa: "[dʒife'ɾẽtʃi]", pronHint: "jee-feh-REN-chee", example: "Esse restaurante é diferente.", exampleEn: "That restaurant is different.", group: "quality" },

  { en: "big", pt: "grande", agreement: "same form", pronIpa: "['gɾɐ̃dʒi]", pronHint: "GRAHN-jee", example: "A cidade é grande.", exampleEn: "The city is big.", group: "size & age" },
  { en: "small", pt: "pequeno", alts: ["pequena"], agreement: "fem.: pequena", pronIpa: "[pe'kenu]", pronHint: "peh-KEH-noo", example: "A casa é pequena, mas confortável.", exampleEn: "The house is small, but comfortable.", group: "size & age" },
  { en: "new", pt: "novo", alts: ["nova"], agreement: "fem.: nova", pronIpa: "['novu]", pronHint: "NOH-voo", example: "A casa é nova.", exampleEn: "The house is new.", group: "size & age" },
  { en: "old", pt: "velho", alts: ["velha"], agreement: "fem.: velha", pronIpa: "['vɛʎu]", pronHint: "VEH-lyoo", example: "Esse prédio é velho.", exampleEn: "That building is old.", group: "size & age" },
  { en: "young", pt: "jovem", agreement: "same form", pronIpa: "['ʒɔvẽ]", pronHint: "ZHOH-veng", example: "Ela é muito jovem.", exampleEn: "She is very young.", group: "size & age" },
  { en: "old / former", pt: "antigo", alts: ["antiga"], agreement: "fem.: antiga", pronIpa: "[ɐ̃'tʃigu]", pronHint: "ahn-CHEE-goo", example: "Meu celular é antigo.", exampleEn: "My cell phone is old.", group: "size & age" },
  { en: "long", pt: "comprido", alts: ["comprida"], agreement: "fem.: comprida", pronIpa: "[kõ'pɾidu]", pronHint: "kohm-PREE-doo", example: "A rua é comprida.", exampleEn: "The street is long.", group: "size & age" },
  { en: "short", pt: "curto", alts: ["curta"], agreement: "fem.: curta", pronIpa: "['kuʁtu]", pronHint: "KOOR-too", example: "O filme é curto.", exampleEn: "The movie is short.", group: "size & age" },
  { en: "heavy", pt: "pesado", alts: ["pesada"], agreement: "fem.: pesada", pronIpa: "[pe'zadu]", pronHint: "peh-ZAH-doo", example: "A mala está pesada.", exampleEn: "The suitcase is heavy.", group: "size & age" },

  { en: "tired", pt: "cansado", alts: ["cansada"], agreement: "fem.: cansada", pronIpa: "[kɐ̃'sadu]", pronHint: "kahn-SAH-doo", example: "Você está cansado hoje?", exampleEn: "Are you tired today?", group: "state & feeling" },
  { en: "ready", pt: "pronto", alts: ["pronta"], agreement: "fem.: pronta", pronIpa: "['pɾõtu]", pronHint: "PROHN-too", example: "A comida está pronta.", exampleEn: "The food is ready.", group: "state & feeling" },
  { en: "happy", pt: "feliz", agreement: "same form", pronIpa: "[fe'lis]", pronHint: "feh-LEES", example: "Ela está feliz hoje.", exampleEn: "She is happy today.", group: "state & feeling" },
  { en: "sad", pt: "triste", agreement: "same form", pronIpa: "['tɾistʃi]", pronHint: "TREES-chee", example: "Ela parece triste hoje.", exampleEn: "She seems sad today.", group: "state & feeling" },
  { en: "busy", pt: "ocupado", alts: ["ocupada"], agreement: "fem.: ocupada", pronIpa: "[oku'padu]", pronHint: "oh-koo-PAH-doo", example: "Estou ocupado agora.", exampleEn: "I am busy right now.", group: "state & feeling" },
  { en: "worried", pt: "preocupado", alts: ["preocupada"], agreement: "fem.: preocupada", pronIpa: "[pɾe.ow.ku'pa.du]", pronHint: "preh-oh-koo-PAH-doo", example: "Ela está preocupada com a prova.", exampleEn: "She is worried about the test.", group: "state & feeling" },
  { en: "calm", pt: "calmo", alts: ["calma"], agreement: "fem.: calma", pronIpa: "['kawmu]", pronHint: "KAHL-moo", example: "Ele parece calmo.", exampleEn: "He seems calm.", group: "state & feeling" },
  { en: "sick / ill", pt: "doente", agreement: "same form", pronIpa: "[do'ẽtʃi]", pronHint: "doh-EN-chee", example: "Ela está doente hoje.", exampleEn: "She is sick today.", group: "state & feeling" },
  { en: "nervous", pt: "nervoso", alts: ["nervosa"], agreement: "fem.: nervosa", pronIpa: "[neʁ'vozu]", pronHint: "nehr-VOH-zoo", example: "Estou nervoso com a entrevista.", exampleEn: "I am nervous about the interview.", group: "state & feeling" },

  { en: "easy", pt: "fácil", agreement: "same form", pronIpa: "['fasiw]", pronHint: "FAH-seew", example: "Essa lição é fácil.", exampleEn: "That lesson is easy.", group: "practical" },
  { en: "difficult", pt: "difícil", agreement: "same form", pronIpa: "[dʒi'fisiw]", pronHint: "jee-FEE-seew", example: "Essa palavra é difícil.", exampleEn: "That word is difficult.", group: "practical" },
  { en: "important", pt: "importante", agreement: "same form", pronIpa: "[ĩpoʁ'tɐ̃tʃi]", pronHint: "eem-por-TAHN-chee", example: "Dormir bem é importante.", exampleEn: "Sleeping well is important.", group: "practical" },
  { en: "hot / warm", pt: "quente", agreement: "same form", pronIpa: "['kẽtʃi]", pronHint: "KEHN-chee", example: "O café está quente.", exampleEn: "The coffee is hot.", group: "practical" },
  { en: "cold", pt: "frio", alts: ["fria"], agreement: "fem.: fria", pronIpa: "['fɾiu]", pronHint: "FREE-oo", example: "A água está fria.", exampleEn: "The water is cold.", group: "practical" },
  { en: "expensive", pt: "caro", alts: ["cara"], agreement: "fem.: cara", pronIpa: "['kaɾu]", pronHint: "KAH-roo", example: "O restaurante é caro.", exampleEn: "The restaurant is expensive.", group: "practical" },
  { en: "cheap", pt: "barato", alts: ["barata"], agreement: "fem.: barata", pronIpa: "[ba'ɾatu]", pronHint: "bah-RAH-too", example: "A comida aqui é barata.", exampleEn: "The food here is cheap.", group: "practical" },
  { en: "open", pt: "aberto", alts: ["aberta"], agreement: "fem.: aberta", pronIpa: "[a'bɛʁtu]", pronHint: "ah-BEHR-too", example: "A loja está aberta.", exampleEn: "The store is open.", group: "practical" },
  { en: "closed", pt: "fechado", alts: ["fechada"], agreement: "fem.: fechada", pronIpa: "[fe'ʃadu]", pronHint: "feh-SHAH-doo", example: "A porta está fechada.", exampleEn: "The door is closed.", group: "practical" },
  { en: "clean", pt: "limpo", alts: ["limpa"], agreement: "fem.: limpa", pronIpa: "['lĩpu]", pronHint: "LEEM-poo", example: "A cozinha está limpa.", exampleEn: "The kitchen is clean.", group: "practical" },
  { en: "dirty", pt: "sujo", alts: ["suja"], agreement: "fem.: suja", pronIpa: "['suʒu]", pronHint: "SOO-zhoo", example: "O chão está sujo.", exampleEn: "The floor is dirty.", group: "practical" },
  { en: "fast", pt: "rápido", alts: ["rápida"], agreement: "fem.: rápida", pronIpa: "['ʁapidu]", pronHint: "HAH-pee-doo", example: "O serviço é rápido.", exampleEn: "The service is fast.", group: "practical" },
  { en: "slow", pt: "lento", alts: ["lenta"], agreement: "fem.: lenta", pronIpa: "['lẽtu]", pronHint: "LEN-too", example: "O ônibus é lento.", exampleEn: "The bus is slow.", group: "practical" },
  { en: "full", pt: "cheio", alts: ["cheia"], agreement: "fem.: cheia", pronIpa: "['ʃeju]", pronHint: "SHAY-yoo", example: "A sala está cheia.", exampleEn: "The room is full.", group: "practical" },
  { en: "empty", pt: "vazio", alts: ["vazia"], agreement: "fem.: vazia", pronIpa: "[va'ziu]", pronHint: "vah-ZEE-oo", example: "A garrafa está vazia.", exampleEn: "The bottle is empty.", group: "practical" }
];

const GROUPS = ["quality", "size & age", "state & feeling", "practical"];
let activeGroups = new Set(GROUPS);
let deck = [];
let current = 0;
let known = new Set();
let answered = false;
let perfect = true;
let stats = { errors: 0, firstTry: 0 };

function normalize(str) {
  return str.trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[?!.,;:]+/g, "")
    .replace(/\s+/g, " ");
}

function shuffle(arr) {
  return [...arr].sort(() => Math.random() - 0.5);
}

function escapeHtml(str) {
  return str
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function buildDeck() {
  deck = shuffle(ALL_CARDS.filter(card => activeGroups.has(card.group)));
  current = 0;
  known = new Set();
  answered = false;
  perfect = true;
  stats = { errors: 0, firstTry: 0 };
  render();
}

function toggleGroup(group) {
  if (activeGroups.has(group)) {
    if (activeGroups.size === 1) return;
    activeGroups.delete(group);
  } else {
    activeGroups.add(group);
  }
  renderFilters();
  buildDeck();
}

function renderFilters() {
  const row = document.getElementById("filterRow");
  row.innerHTML = GROUPS.map(group => {
    const safeGroup = group.replace(/\\/g, "\\\\").replace(/'/g, "\\'");
    return `<button class="fc-tag ${activeGroups.has(group) ? "active" : ""}" onclick="toggleGroup('${safeGroup}')">${escapeHtml(group)}</button>`;
  }).join("");
}

function updateStats() {
  const total = deck.length;
  const knownCount = known.size;
  const pct = total > 0 ? Math.round((knownCount / total) * 100) : 0;

  document.getElementById("statTotal").textContent = total;
  document.getElementById("statKnown").textContent = knownCount;
  document.getElementById("statLeft").textContent = total - knownCount;
  document.getElementById("progressBar").style.width = pct + "%";
  document.getElementById("progressPct").textContent = pct + "%";
}

function buildReveal(card) {
  return `
    <div class="example">
      <span class="example-text">${escapeHtml(card.example)}</span>
      <span class="example-translation">${escapeHtml(card.exampleEn)}</span>
    </div>
  `;
}

function render() {
  updateStats();
  const area = document.getElementById("cardArea");
  const remaining = deck.filter((_, i) => !known.has(i));

  if (deck.length === 0) {
    area.innerHTML = `
      <div class="card done-screen">
        <h2>No matching cards</h2>
        <p>Pick at least one adjective group to keep practicing.</p>
      </div>
    `;
    return;
  }

  if (remaining.length === 0) {
    const title = perfect ? "Perfeito!" : "Deck complete!";
    const subtitle = perfect
      ? `You cleared all ${deck.length} adjective cards without errors.`
      : `You finished all ${deck.length} adjective cards.`;

    area.innerHTML = `
      <div class="card done-screen">
        <h2>${title}</h2>
        <p>${subtitle}</p>
        <div class="result-stats">
          <div class="result-stat">
            <div class="result-stat-num green">${stats.firstTry}</div>
            <div class="result-stat-lbl">First try</div>
          </div>
          <div class="result-stat">
            <div class="result-stat-num red">${stats.errors}</div>
            <div class="result-stat-lbl">Errors made</div>
          </div>
        </div>
        <button class="ctrl-btn" onclick="buildDeck()" style="font-size:0.8rem;padding:0.6rem 1.4rem;">Start over ↺</button>
      </div>
    `;
    return;
  }

  while (known.has(current)) current = (current + 1) % deck.length;
  const card = deck[current];

  area.innerHTML = `
    <div class="card">
      <div class="card-meta">${escapeHtml(card.group)}</div>
      <div class="card-prompt">${escapeHtml(card.en)}</div>
      <div class="card-sub">Type the Portuguese adjective</div>
      <div class="input-row">
        <input class="answer-input" id="answerInput" type="text" placeholder="type here..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
        <button class="check-btn" id="actionBtn" onclick="handleAction()">→</button>
      </div>
      <div class="feedback" id="feedback"></div>
      <div id="revealArea"></div>
    </div>
    <div class="controls">
      <button class="ctrl-btn" onclick="skipCard()">Skip →</button>
      <button class="ctrl-btn" onclick="buildDeck()">Restart ↺</button>
    </div>
  `;

  answered = false;
  const input = document.getElementById("answerInput");
  input.focus();
  input.addEventListener("keydown", event => {
    if (event.key === "Enter") handleAction();
  });
}

function handleAction() {
  if (answered) {
    nextCard();
    return;
  }
  checkAnswer();
}

function checkAnswer() {
  const card = deck[current];
  const input = document.getElementById("answerInput");
  const feedback = document.getElementById("feedback");
  const revealArea = document.getElementById("revealArea");
  const button = document.getElementById("actionBtn");

  if (!input.value.trim()) return;

  answered = true;
  input.disabled = true;

  const acceptedAnswers = [card.pt, ...(card.alts || [])].map(normalize);
  const given = normalize(input.value);
  const answerDisplay = [card.pt, ...(card.alts || [])].map(escapeHtml).join(" / ");

  if (acceptedAnswers.includes(given)) {
    stats.firstTry++;
    input.classList.add("correct");
    button.classList.add("go-green");
    feedback.className = "feedback ok";
    feedback.innerHTML = `✓ Correct — <strong>${answerDisplay}</strong> <span class="pron-tag">${escapeHtml(card.pronHint)}</span>`;
    revealArea.innerHTML = buildReveal(card);
    known.add(current);
    updateStats();
  } else {
    stats.errors++;
    perfect = false;
    input.classList.add("wrong", "shake");
    button.classList.add("go-red");
    feedback.className = "feedback err";
    feedback.innerHTML = `✗ The answer is <strong>${answerDisplay}</strong> <span class="pron-tag">${escapeHtml(card.pronHint)}</span>`;
    revealArea.innerHTML = buildReveal(card);
    setTimeout(() => input.classList.remove("shake"), 400);
  }

  setTimeout(() => button.focus(), 0);
}

function advanceToNextUnknown() {
  if (deck.length === 0 || known.size === deck.length) {
    answered = false;
    render();
    return;
  }

  current = (current + 1) % deck.length;
  while (known.has(current)) current = (current + 1) % deck.length;
  answered = false;
  render();
}

function nextCard() {
  advanceToNextUnknown();
}

function skipCard() {
  known.add(current);
  updateStats();
  advanceToNextUnknown();
}

renderFilters();
buildDeck();
</script>
</body>
</html>

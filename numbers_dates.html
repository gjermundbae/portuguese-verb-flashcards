<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portuguese Numbers and Dates Flashcards</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F5F0E8;
    --surface: #FFFDF7;
    --surface2: #EDE8DC;
    --border: #D4CCBA;
    --border2: #BEB5A0;
    --text: #1A1712;
    --text2: #6B6456;
    --text3: #9E9485;
    --green: #2D6A4F;
    --green-bg: #D8F3DC;
    --red: #7D2B2B;
    --red-bg: #FFE8E8;
    --accent: #C4922A;
    --accent-bg: #FFF3DC;
    --radius: 12px;
    --radius-sm: 8px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 4rem;
  }

  header { text-align: center; margin-bottom: 2.5rem; }

  header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 2.4rem;
    color: var(--text);
    letter-spacing: -0.5px;
    line-height: 1.1;
  }

  header h1 em { font-style: italic; color: var(--accent); }

  header p {
    font-size: 0.75rem;
    color: var(--text3);
    margin-top: 0.4rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  header p a {
    color: var(--text3);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.15s, color 0.15s;
    padding-bottom: 1px;
  }

  header p a:hover { color: var(--text2); border-bottom-color: var(--border2); }
  header p a.active { color: var(--text2); border-bottom-color: var(--text3); }

  .container { width: 100%; max-width: 520px; }

  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1.5rem; }

  .fc-tag {
    font-size: 0.7rem;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text2);
    cursor: pointer;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    transition: all 0.15s;
    font-family: 'DM Mono', monospace;
  }

  .fc-tag:hover { border-color: var(--border2); }

  .fc-tag.active {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 1.25rem;
  }

  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.75rem;
    text-align: center;
  }

  .stat-num {
    font-family: 'DM Serif Display', serif;
    font-size: 1.75rem;
    color: var(--text);
    line-height: 1;
  }

  .stat-num.green { color: var(--green); }
  .stat-num.red { color: var(--red); }

  .stat-lbl {
    font-size: 0.65rem;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 3px;
  }

  .progress-row { display: flex; align-items: center; gap: 10px; margin-bottom: 1.75rem; }

  .progress-bg {
    flex: 1;
    height: 4px;
    background: var(--surface2);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--green);
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  .progress-pct {
    font-size: 0.7rem;
    color: var(--text3);
    min-width: 32px;
    text-align: right;
    letter-spacing: 0.05em;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2rem 1.75rem;
    margin-bottom: 1rem;
    animation: slideIn 0.2s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-meta {
    font-size: 0.65rem;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 0.6rem;
  }

  .card-prompt {
    font-family: 'DM Serif Display', serif;
    font-size: 1.9rem;
    color: var(--text);
    line-height: 1.2;
    margin-bottom: 0.35rem;
  }

  .card-sub {
    font-size: 0.72rem;
    color: var(--text3);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 1.5rem;
  }

  .input-row { display: flex; gap: 8px; }

  .answer-input {
    flex: 1;
    font-family: 'DM Mono', monospace;
    font-size: 1rem;
    padding: 0.65rem 0.9rem;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s, background 0.15s;
  }

  .answer-input:focus { border-color: var(--accent); background: var(--surface); }

  .answer-input.correct {
    border-color: var(--green);
    background: var(--green-bg);
    color: var(--green);
  }

  .answer-input.wrong {
    border-color: var(--red);
    background: var(--red-bg);
    color: var(--red);
  }

  .answer-input:disabled { opacity: 1; }

  .check-btn {
    font-size: 1.15rem;
    padding: 0.65rem 0.9rem;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border2);
    background: var(--text);
    color: var(--bg);
    cursor: pointer;
    transition: opacity 0.15s, background 0.2s, border-color 0.2s;
    white-space: nowrap;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .check-btn:hover { opacity: 0.85; }
  .check-btn.go-green { background: var(--green); border-color: var(--green); }
  .check-btn.go-red { background: var(--red); border-color: var(--red); }

  .feedback {
    margin-top: 1rem;
    font-size: 0.8rem;
    min-height: 18px;
    line-height: 1.5;
  }

  .feedback.ok { color: var(--green); }
  .feedback.err { color: var(--red); }

  .pron-tag {
    display: inline-block;
    font-size: 0.7rem;
    background: var(--accent-bg);
    color: var(--accent);
    border: 1px solid #E8C97A;
    border-radius: 999px;
    padding: 2px 10px;
    letter-spacing: 0.04em;
    margin-left: 8px;
    vertical-align: middle;
  }

  .example {
    font-size: 0.78rem;
    color: var(--text2);
    font-style: italic;
    margin-top: 0.5rem;
    padding-top: 0.75rem;
    border-top: 1px dashed var(--border);
  }

  .tip {
    font-size: 0.78rem;
    color: var(--text2);
    margin-top: 0.5rem;
    line-height: 1.5;
  }

  .tip strong { color: var(--text); font-weight: 500; }

  .controls {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .ctrl-btn {
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    color: var(--text3);
    background: none;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.4rem 0.8rem;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: all 0.15s;
    text-transform: uppercase;
  }

  .ctrl-btn:hover { background: var(--surface); color: var(--text2); border-color: var(--border2); }

  .done-screen { text-align: center; padding: 3rem 1rem; }
  .done-screen .trophy { font-size: 3rem; margin-bottom: 1rem; }

  .done-screen h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.8rem;
    color: var(--text);
    margin-bottom: 0.5rem;
  }

  .done-screen p {
    font-size: 0.8rem;
    color: var(--text2);
    margin-bottom: 2rem;
    letter-spacing: 0.04em;
  }

  .result-stats {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    margin: 1.25rem 0 1.5rem;
  }

  .result-stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.9rem 0.75rem;
  }

  .result-stat-num {
    font-family: 'DM Serif Display', serif;
    font-size: 1.55rem;
    line-height: 1;
    color: var(--text);
  }

  .result-stat-num.green { color: var(--green); }
  .result-stat-num.red { color: var(--red); }

  .result-stat-lbl {
    font-size: 0.65rem;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 0.35rem;

  .fireworks-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 9999;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  .answer-input.shake { animation: shake 0.4s ease; }
</style>

<script>
const ALL_CARDS = [
  { prompt: "one", answer: "um", alts: ["uma"], pron: "OOM / OO-mah", example: "1 = um", tip: "Use <strong>uma</strong> before feminine nouns: <em>uma casa</em>. For straight counting, <strong>um</strong> is the base form.", group: "cardinal numbers" },
  { prompt: "two", answer: "dois", alts: ["duas"], pron: "DOYSS / DOO-ahs", example: "2 = dois", tip: "<strong>Dois</strong> is the base form. Use <strong>duas</strong> before feminine nouns: <em>duas semanas</em>.", group: "cardinal numbers" },
  { prompt: "three", answer: "três", pron: "TRAYSS", example: "3 = três", group: "cardinal numbers" },
  { prompt: "four", answer: "quatro", pron: "KWAH-troo", example: "4 = quatro", group: "cardinal numbers" },
  { prompt: "five", answer: "cinco", pron: "SEEN-koo", example: "5 = cinco", group: "cardinal numbers" },
  { prompt: "six", answer: "seis", pron: "SAYSS", example: "6 = seis", group: "cardinal numbers" },
  { prompt: "seven", answer: "sete", pron: "SEH-chee", example: "7 = sete", group: "cardinal numbers" },
  { prompt: "eight", answer: "oito", pron: "OY-too", example: "8 = oito", group: "cardinal numbers" },
  { prompt: "nine", answer: "nove", pron: "NOH-vee", example: "9 = nove", group: "cardinal numbers" },
  { prompt: "ten", answer: "dez", pron: "DEZZ", example: "10 = dez", group: "cardinal numbers" },
  { prompt: "eleven", answer: "onze", pron: "OHN-zee", example: "11 = onze", group: "cardinal numbers" },
  { prompt: "twelve", answer: "doze", pron: "DOH-zee", example: "12 = doze", group: "cardinal numbers" },
  { prompt: "thirteen", answer: "treze", pron: "TRAY-zee", example: "13 = treze", group: "cardinal numbers" },
  { prompt: "fourteen", answer: "quatorze", alts: ["catorze"], pron: "kwa-TOHR-zee / kah-TOHR-zee", example: "14 = quatorze", tip: "Both <strong>quatorze</strong> and <strong>catorze</strong> are correct in Brazil.", group: "cardinal numbers" },
  { prompt: "fifteen", answer: "quinze", pron: "KEEN-zee", example: "15 = quinze", group: "cardinal numbers" },
  { prompt: "sixteen", answer: "dezesseis", pron: "deh-zeh-SAYSS", example: "16 = dezesseis", group: "cardinal numbers" },
  { prompt: "seventeen", answer: "dezessete", pron: "deh-zeh-SEH-chee", example: "17 = dezessete", group: "cardinal numbers" },
  { prompt: "eighteen", answer: "dezoito", pron: "deh-ZOY-too", example: "18 = dezoito", group: "cardinal numbers" },
  { prompt: "nineteen", answer: "dezenove", pron: "deh-zeh-NOH-vee", example: "19 = dezenove", group: "cardinal numbers" },
  { prompt: "twenty", answer: "vinte", pron: "VEEN-chee", example: "20 = vinte", group: "cardinal numbers" },
  { prompt: "thirty", answer: "trinta", pron: "TREEN-tah", example: "30 = trinta", group: "cardinal numbers" },
  { prompt: "forty", answer: "quarenta", pron: "kwah-REN-tah", example: "40 = quarenta", group: "cardinal numbers" },
  { prompt: "fifty", answer: "cinquenta", pron: "seen-KWEN-tah", example: "50 = cinquenta", group: "cardinal numbers" },
  { prompt: "sixty", answer: "sessenta", pron: "seh-SEN-tah", example: "60 = sessenta", group: "cardinal numbers" },
  { prompt: "seventy", answer: "setenta", pron: "seh-TEN-tah", example: "70 = setenta", group: "cardinal numbers" },
  { prompt: "eighty", answer: "oitenta", pron: "oy-TEN-tah", example: "80 = oitenta", group: "cardinal numbers" },
  { prompt: "ninety", answer: "noventa", pron: "noh-VEN-tah", example: "90 = noventa", group: "cardinal numbers" },
  { prompt: "one hundred", answer: "cem", pron: "SEHNG", example: "100 = cem", tip: "<strong>Cem</strong> is exactly 100. Before another number, use <strong>cento</strong>: <em>cento e um</em>.", group: "cardinal numbers" },

  { prompt: "first", answer: "primeiro", alts: ["primeira"], pron: "pree-MAY-roo / pree-MAY-rah", example: "1º lugar / 1ª vez", tip: "Ordinals agree with gender: <strong>primeiro</strong> for masculine nouns, <strong>primeira</strong> for feminine nouns. In Brazilian dates, only the first day is usually ordinal: <em>primeiro de maio</em>.", group: "ordinal numbers" },
  { prompt: "second", answer: "segundo", alts: ["segunda"], pron: "seh-GOON-doo / seh-GOON-dah", example: "2º andar / segunda-feira", tip: "Use <strong>segunda</strong> with feminine nouns, as in <em>segunda-feira</em>.", group: "ordinal numbers" },
  { prompt: "third", answer: "terceiro", alts: ["terceira"], pron: "tehr-SAY-roo / tehr-SAY-rah", example: "3º lugar / 3ª tentativa", tip: "Like other ordinals, it changes for gender: <strong>terceiro</strong> / <strong>terceira</strong>.", group: "ordinal numbers" },
  { prompt: "fourth", answer: "quarto", alts: ["quarta"], pron: "KWAHR-too / KWAHR-tah", example: "4º andar / 4ª aula", tip: "<strong>Quarta-feira</strong> literally means 'fourth day' in Portuguese weekday naming.", group: "ordinal numbers" },
  { prompt: "fifth", answer: "quinto", alts: ["quinta"], pron: "KEEN-too / KEEN-tah", example: "5º capítulo / 5ª série", tip: "Use <strong>quinta</strong> with feminine nouns: <em>quinta avenida</em>, <em>quinta-feira</em>.", group: "ordinal numbers" },
  { prompt: "sixth", answer: "sexto", alts: ["sexta"], pron: "SESS-too / SESS-tah", example: "6º item / 6ª rodada", tip: "<strong>Sexta-feira</strong> is literally 'sixth day'.", group: "ordinal numbers" },
  { prompt: "seventh", answer: "sétimo", alts: ["sétima"], pron: "SEH-chee-moo / SEH-chee-mah", example: "7º dia / 7ª vez", tip: "Accent marks matter in writing, but the quiz accepts answers without accents too.", group: "ordinal numbers" },
  { prompt: "eighth", answer: "oitavo", alts: ["oitava"], pron: "oy-TAH-voo / oy-TAH-vah", example: "8º andar / 8ª temporada", tip: "Use the masculine or feminine form to match the noun that follows.", group: "ordinal numbers" },
  { prompt: "ninth", answer: "nono", alts: ["nona"], pron: "NOH-noo / NOH-nah", example: "9º mês / 9ª edição", tip: "<strong>Nono</strong> and <strong>nona</strong> are common in rankings and school years.", group: "ordinal numbers" },
  { prompt: "tenth", answer: "décimo", alts: ["décima"], pron: "DEH-see-moo / DEH-see-mah", example: "10º andar / 10ª vez", tip: "Higher ordinals exist, but in everyday Brazilian Portuguese the first ten are the most useful by far.", group: "ordinal numbers" },

  { prompt: "Monday", answer: "segunda-feira", alts: ["segunda"], pron: "seh-GOON-dah FAY-rah", example: "Hoje é segunda-feira.", tip: "In Brazil, people often shorten it to <strong>segunda</strong> in conversation, but <strong>segunda-feira</strong> is the full form.", group: "weekdays" },
  { prompt: "Tuesday", answer: "terça-feira", alts: ["terça", "terca-feira", "terca"], pron: "TEHR-sah FAY-rah", example: "A aula é na terça-feira.", tip: "The cedilla matters in writing: <strong>terça</strong>. The quiz also accepts answers without diacritics.", group: "weekdays" },
  { prompt: "Wednesday", answer: "quarta-feira", alts: ["quarta"], pron: "KWAHR-tah FAY-rah", example: "Trabalho na quarta-feira.", tip: "Like <strong>segunda</strong> and <strong>terça</strong>, the shorter form <strong>quarta</strong> is very common in speech.", group: "weekdays" },
  { prompt: "Thursday", answer: "quinta-feira", alts: ["quinta"], pron: "KEEN-tah FAY-rah", example: "Nos vemos na quinta-feira.", tip: "You will often hear just <strong>quinta</strong> in everyday Brazilian Portuguese.", group: "weekdays" },
  { prompt: "Friday", answer: "sexta-feira", alts: ["sexta"], pron: "SESS-tah FAY-rah", example: "Sexta-feira é meu dia favorito.", tip: "<strong>Sexta</strong> alone is natural in speech, but <strong>sexta-feira</strong> is the full weekday name.", group: "weekdays" },
  { prompt: "Saturday", answer: "sábado", pron: "SAH-bah-doo", example: "Vamos viajar no sábado.", tip: "Unlike Monday through Friday, <strong>sábado</strong> does not use <strong>-feira</strong>.", group: "weekdays" },
  { prompt: "Sunday", answer: "domingo", pron: "doh-MEEN-goo", example: "No domingo eu descanso.", tip: "<strong>Domingo</strong> also stands alone, without <strong>-feira</strong>.", group: "weekdays" },

  { prompt: "January", answer: "janeiro", pron: "zhah-NAY-roo", example: "Meu aniversário é em janeiro.", tip: "Month names stay lowercase in Portuguese: <strong>janeiro</strong>, not <strong>Janeiro</strong>.", group: "months" },
  { prompt: "February", answer: "fevereiro", pron: "feh-veh-RAY-roo", example: "O carnaval costuma cair em fevereiro.", group: "months" },
  { prompt: "March", answer: "março", pron: "MAHR-soo", example: "As aulas começam em março.", tip: "Write it with <strong>ç</strong>: <strong>março</strong>.", group: "months" },
  { prompt: "April", answer: "abril", pron: "ah-BREEL", example: "Em abril faz mais frio.", group: "months" },
  { prompt: "May", answer: "maio", pron: "MY-yoo", example: "Primeiro de maio é feriado.", group: "months" },
  { prompt: "June", answer: "junho", pron: "ZHOON-yoo", example: "As festas juninas são em junho.", group: "months" },
  { prompt: "July", answer: "julho", pron: "ZHOO-lyoo", example: "Viajo em julho.", tip: "<strong>Junho</strong> and <strong>julho</strong> are easy to mix up, so it helps to learn them together.", group: "months" },
  { prompt: "August", answer: "agosto", pron: "ah-GOHS-too", example: "Agosto tem muito vento.", group: "months" },
  { prompt: "September", answer: "setembro", pron: "seh-TEM-broo", example: "Setembro vem depois de agosto.", group: "months" },
  { prompt: "October", answer: "outubro", pron: "ow-TOO-broo", example: "Meu curso termina em outubro.", group: "months" },
  { prompt: "November", answer: "novembro", pron: "noh-VEM-broo", example: "Novembro antecede dezembro.", group: "months" },
  { prompt: "December", answer: "dezembro", pron: "deh-ZEM-broo", example: "O Natal é em dezembro.", group: "months" }
];

const GROUPS = ["cardinal numbers", "ordinal numbers", "weekdays", "months"];
const GROUP_LABELS = {
  "cardinal numbers": "cardinal numbers",
  "ordinal numbers": "ordinal numbers",
  "weekdays": "days of the week",
  "months": "months"
};
let activeGroups = new Set(GROUPS);
let deck = [];
let current = 0;
let known = new Set();
let answered = false;
let perfect = true;
let stats = { errors: 0, firstTry: 0 };

function normalize(str) {
  return str.trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/-/g, " ")
    .replace(/[?!.,;:ºª]+/g, "")
    .replace(/\s+/g, " ");
}

function getAcceptedAnswers(card) {
  return [card.answer, ...(card.alts || [])];
}

function getUniqueAcceptedAnswers(card) {
  const seen = new Set();
  return getAcceptedAnswers(card).filter(answer => {
    const normalized = normalize(answer);
    if (seen.has(normalized)) return false;
    seen.add(normalized);
    return true;
  });
}

function formatAcceptedAnswers(card) {
  return getUniqueAcceptedAnswers(card).join(" / ");
}

function shuffle(arr) {
  return [...arr].sort(() => Math.random() - 0.5);
}

function escapeHtml(str) {
  return str
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function buildDeck() {
  deck = shuffle(ALL_CARDS.filter(card => activeGroups.has(card.group)));
  current = 0;
  known = new Set();
  answered = false;
  perfect = true;
  stats = { errors: 0, firstTry: 0 };
  render();
}

function updateStats() {
  const total = deck.length;
  const knownCount = known.size;
  const pct = total > 0 ? Math.round((knownCount / total) * 100) : 0;

  document.getElementById("statTotal").textContent = total;
  document.getElementById("statKnown").textContent = knownCount;
  document.getElementById("statLeft").textContent = total - knownCount;
  document.getElementById("progressBar").style.width = pct + "%";
  document.getElementById("progressPct").textContent = pct + "%";
}

function buildReveal(card) {
  const example = card.example ? `<div class="example">${escapeHtml(card.example)}</div>` : "";
  const tip = card.tip ? `<div class="tip"><strong>Usage:</strong> ${card.tip}</div>` : "";
  return example + tip;
}

function render() {
  updateStats();
  const area = document.getElementById("cardArea");
  const remaining = deck.filter((_, index) => !known.has(index));

  if (remaining.length === 0 && deck.length > 0) {
    const title = perfect ? "Perfeito!" : "Deck complete!";
    const subtitle = perfect
      ? `You cleared all ${deck.length} cards without errors.`
      : `You finished all ${deck.length} cards.`;

    area.innerHTML = `
      <div class="card done-screen">
        <div class="trophy">${perfect ? "🎆" : "🏆"}</div>
        <h2>${title}</h2>
        <p>${subtitle}</p>
        <div class="result-stats">
          <div class="result-stat">
            <div class="result-stat-num green">${stats.firstTry}</div>
            <div class="result-stat-lbl">First try</div>
          </div>
          <div class="result-stat">
            <div class="result-stat-num red">${stats.errors}</div>
            <div class="result-stat-lbl">Errors made</div>
          </div>
        </div>
        <button class="ctrl-btn" onclick="buildDeck()" style="font-size:0.8rem;padding:0.6rem 1.4rem;">Start over ↺</button>
      </div>`;

    if (perfect) launchFireworks();
    return;
  }

  while (known.has(current)) current = (current + 1) % deck.length;
  const card = deck[current];

  area.innerHTML = `
    <div class="card">
      <div class="card-meta">${escapeHtml(GROUP_LABELS[card.group] || card.group)}</div>
      <div class="card-prompt">${escapeHtml(card.prompt)}</div>
      <div class="card-sub">Type the Portuguese form</div>
      <div class="input-row">
        <input class="answer-input" id="answerInput" type="text" placeholder="type here…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
        <button class="check-btn" id="actionBtn" onclick="handleAction()">→</button>
      </div>
      <div class="feedback" id="feedback"></div>
      <div id="revealArea"></div>
    </div>
    <div class="controls">
      <button class="ctrl-btn" onclick="skipCard()">Skip →</button>
      <button class="ctrl-btn" onclick="buildDeck()">Restart ↺</button>
    </div>
  `;

  answered = false;
  const input = document.getElementById("answerInput");
  input.focus();
  input.addEventListener("keydown", event => {
    if (event.key === "Enter") handleAction();
  });
}

function handleAction() {
  if (answered) {
    nextCard();
    return;
  }
  checkAnswer();
}

function checkAnswer() {
  const card = deck[current];
  const input = document.getElementById("answerInput");
  const feedback = document.getElementById("feedback");
  const revealArea = document.getElementById("revealArea");
  const button = document.getElementById("actionBtn");

  if (!input.value.trim()) return;

  answered = true;
  input.disabled = true;

  const correctAnswers = getUniqueAcceptedAnswers(card);
  const acceptedDisplay = formatAcceptedAnswers(card);
  const acceptedNormalized = new Set(correctAnswers.map(normalize));
  const given = normalize(input.value);

  if (acceptedNormalized.has(given)) {
    stats.firstTry++;
    input.classList.add("correct");
    button.classList.add("go-green");
    feedback.className = "feedback ok";
    feedback.innerHTML = `✓ Correct — <strong>${escapeHtml(acceptedDisplay)}</strong> <span class="pron-tag">${escapeHtml(card.pron)}</span>`;
    revealArea.innerHTML = buildReveal(card);
    known.add(current);
    updateStats();
  } else {
    stats.errors++;
    perfect = false;
    input.classList.add("wrong", "shake");
    button.classList.add("go-red");
    feedback.className = "feedback err";
    feedback.innerHTML = `✗ Accepted here: <strong>${escapeHtml(acceptedDisplay)}</strong> <span class="pron-tag">${escapeHtml(card.pron)}</span>`;
    revealArea.innerHTML = buildReveal(card);
    setTimeout(() => input.classList.remove("shake"), 400);
  }

  setTimeout(() => button.focus(), 0);
}

function advanceToNextUnknown() {
  if (deck.length === 0 || known.size === deck.length) {
    answered = false;
    render();
    return;
  }

  current = (current + 1) % deck.length;
  while (known.has(current)) current = (current + 1) % deck.length;
  answered = false;
  render();
}

function nextCard() {
  advanceToNextUnknown();
}

function skipCard() {
  known.add(current);
  updateStats();
  advanceToNextUnknown();
}

function renderFilters() {
  document.getElementById("filterRow").innerHTML = GROUPS.map(group =>
    `<div class="fc-tag active" onclick="toggleGroup(this,'${group}')">${escapeHtml(GROUP_LABELS[group] || group)}</div>`
  ).join("");
}

function toggleGroup(el, group) {
  if (activeGroups.has(group)) {
    if (activeGroups.size === 1) return;
    activeGroups.delete(group);
    el.classList.remove("active");
  } else {
    activeGroups.add(group);
    el.classList.add("active");
  }
  buildDeck();
}

function launchFireworks() {
  const canvas = document.createElement("canvas");
  canvas.className = "fireworks-canvas";
  document.body.appendChild(canvas);
  const ctx = canvas.getContext("2d");
  let width;
  let height;

  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }

  resize();
  window.addEventListener("resize", resize);

  const particles = [];
  const colors = ["#C4922A", "#2D6A4F", "#7D2B2B", "#E8C97A", "#6B6456", "#F5F0E8"];

  function burst(x, y) {
    const count = 50 + Math.random() * 30;
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * 5;
      particles.push({
        x,
        y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: 0.012 + Math.random() * 0.012,
        color: colors[Math.floor(Math.random() * colors.length)],
        size: 2 + Math.random() * 3
      });
    }
  }

  let bursts = 0;
  const maxBursts = 6;

  function scheduleBurst() {
    if (bursts >= maxBursts) return;
    burst(width * (0.2 + Math.random() * 0.6), height * (0.15 + Math.random() * 0.45));
    bursts++;
    setTimeout(scheduleBurst, 250 + Math.random() * 350);
  }

  scheduleBurst();

  function frame() {
    ctx.clearRect(0, 0, width, height);
    for (let i = particles.length - 1; i >= 0; i--) {
      const particle = particles[i];
      particle.x += particle.vx;
      particle.y += particle.vy;
      particle.vy += 0.06;
      particle.vx *= 0.99;
      particle.life -= particle.decay;

      if (particle.life <= 0) {
        particles.splice(i, 1);
        continue;
      }

      ctx.globalAlpha = particle.life;
      ctx.fillStyle = particle.color;
      ctx.beginPath();
      ctx.arc(particle.x, particle.y, particle.size * particle.life, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalAlpha = 1;
    if (particles.length > 0 || bursts < maxBursts) {
      requestAnimationFrame(frame);
    } else {
      canvas.remove();
    }
  }

  requestAnimationFrame(frame);
}

renderFilters();
buildDeck();
</script>
